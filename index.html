<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Viana — how I want to spend my time</title>
<meta name="viana-version" content="2.1">
<meta name="theme-color" content="#5b7f6a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%235b7f6a'/%3E%3Cpath d='M20 22l12 22 12-22' stroke='%23fff' stroke-width='6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
/* ============ Theme (from version 1) ============ */
:root{
  --bg:#f6f4ef;--surface:#ffffff;--surface-2:#fbfaf7;--text:#2b2d2a;--muted:#767870;--border:#e6e2d8;
  --accent:#5b7f6a;--accent-ink:#ffffff;--accent-soft:#e7efe9;--accent-2:#8a6f9e;--accent-2-soft:#f0eaf4;
  --good:#5b7f6a;--mid:#b88a3e;--mid-soft:#f6eedf;--low:#9a8f86;--info:#4f7896;--info-soft:#e4edf3;--danger:#b4574c;--danger-soft:#f6e5e2;
  --radius:14px;--shadow:0 1px 2px rgba(40,40,30,.05),0 4px 16px rgba(40,40,30,.05);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#1a1c1a;--surface:#232623;--surface-2:#1f221f;--text:#e7e5df;--muted:#9b9e95;--border:#353a34;
  --accent:#8db89b;--accent-ink:#152018;--accent-soft:#2a372e;--accent-2:#b79bcb;--accent-2-soft:#342c3a;
  --good:#8db89b;--mid:#d6aa5e;--mid-soft:#3a3122;--low:#8d857e;--info:#86a9c4;--info-soft:#24313b;--danger:#d98479;--danger-soft:#3a2724;--shadow:none}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body.modal-open{overflow:hidden}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
h1,h2,h3{font-family:var(--serif);font-weight:600;letter-spacing:-.01em;margin:0}
h1{font-size:1.9rem;line-height:1.2}h2{font-size:1.25rem}h3{font-size:1.05rem}
input,select,textarea,button{font:inherit;color:inherit}
input[type=text],input[type=date],input[type=number],input[type=password],input[type=search],select,textarea{
  width:100%;padding:.55rem .7rem;border:1px solid var(--border);border-radius:10px;background:var(--surface);outline:none;transition:border-color .15s}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
input:disabled{opacity:.5}
textarea{resize:vertical;min-height:2.6rem}
.invalid{border-color:var(--danger)!important}
.muted{color:var(--muted)}.small{font-size:.85rem}
.hidden{display:none!important}
.spacer{flex:1}
.err{color:var(--danger);font-size:.88rem;min-height:1.2em;margin-top:.5rem}
.row{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}

/* ============ Login ============ */
#auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem}
.authbox{width:100%;max-width:380px}
.authlogo{display:flex;flex-direction:column;align-items:center;gap:.6rem;margin-bottom:1.4rem;text-align:center}
.authlogo .brand-dot{width:52px;height:52px}
.authlogo .brand-dot svg{width:26px;height:26px}
.authlogo h1{font-size:2.2rem}
.tabs{display:flex;gap:.3rem;background:var(--surface-2);border:1px solid var(--border);padding:.25rem;border-radius:12px;margin-bottom:1rem}
.tabs button{flex:1;border:none;background:transparent;padding:.5rem;border-radius:9px;cursor:pointer;font-weight:600;color:var(--muted)}
.tabs button.on{background:var(--surface);box-shadow:var(--shadow);color:var(--accent)}
.modepill{font-size:.8rem;text-align:center;color:var(--muted);margin-top:1rem}
.ver{font-size:.75rem;text-align:center;color:var(--muted);margin-top:.4rem}

/* ============ Layout ============ */
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
.topbar-in{max-width:1040px;margin:0 auto;display:flex;align-items:center;gap:1rem;padding:.7rem 1.2rem .3rem}
.brand{font-family:var(--serif);font-size:1.35rem;font-weight:600;color:var(--text);display:flex;align-items:center;gap:.5rem}
.brand-dot{width:22px;height:22px;border-radius:50%;background:var(--accent);display:inline-grid;place-items:center;flex:none}
.brand-dot svg{width:12px;height:12px;stroke:var(--accent-ink);stroke-width:3;fill:none}
.who{margin-left:auto;display:flex;align-items:center;gap:.5rem;font-size:.85rem;color:var(--muted)}
.mode{font-size:.75rem;padding:.12rem .55rem;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600;white-space:nowrap}
.mode.local{background:var(--mid-soft);color:var(--mid)}
.adminb{font-size:.7rem;font-weight:700;padding:.12rem .5rem;border-radius:999px;background:var(--accent);color:var(--accent-ink)}
nav.nav{max-width:1040px;margin:0 auto;display:flex;gap:.25rem;padding:.2rem 1rem .55rem;overflow-x:auto;scrollbar-width:none}
nav.nav a{display:flex;align-items:center;gap:.4rem;padding:.45rem .8rem;border-radius:999px;color:var(--muted);font-weight:500;cursor:pointer;white-space:nowrap}
nav.nav a:hover{text-decoration:none;color:var(--text);background:var(--surface)}
nav.nav a.active{color:var(--accent);background:var(--accent-soft)}
nav.nav svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#botnav{display:none}
.viewas{background:var(--mid-soft);color:var(--mid);padding:.55rem 1rem;font-size:.88rem;display:flex;gap:.6rem;align-items:center;justify-content:center;flex-wrap:wrap}
main{max-width:1040px;margin:0 auto;padding:1.6rem 1.2rem 4rem}
@media (max-width:760px){
  .topbar{backdrop-filter:none;background:var(--bg)}
  .topbar-in{padding:.6rem 1rem}
  #topnav{display:none}
  #botnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--border);justify-content:space-around;padding:.3rem .1rem calc(.3rem + env(safe-area-inset-bottom));overflow:visible}
  #botnav a{flex-direction:column;gap:.1rem;font-size:.62rem;padding:.35rem .2rem;border-radius:10px;flex:1;min-width:0}
  main{padding:1.1rem .9rem 6.5rem}
  h1{font-size:1.55rem}
  .who .uname,.mode .mtx{display:none}
}

/* ============ Components ============ */
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:1rem;flex-wrap:wrap;margin-bottom:1.2rem}
.eyebrow{text-transform:uppercase;letter-spacing:.09em;font-size:.72rem;font-weight:600;color:var(--accent)}
.lede{color:var(--muted);margin:.3rem 0 0}
.head-actions{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:1.1rem 1.2rem;margin-bottom:1rem}
.card.soft{background:var(--surface-2);box-shadow:none}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:.8rem;margin-bottom:.7rem;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.35rem;padding:.55rem 1rem;border-radius:999px;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-weight:500;white-space:nowrap;transition:background .15s,border-color .15s;color:var(--text)}
.btn:hover{border-color:var(--accent);text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger)}.btn.danger:hover{border-color:var(--danger)}
.btn.sm{padding:.3rem .75rem;font-size:.85rem}
.btn.full{width:100%;margin-top:1rem;padding:.65rem}
.btn:disabled{opacity:.45;cursor:default}
.icon-btn{border:1px solid transparent;background:transparent;width:32px;height:32px;border-radius:50%;cursor:pointer;display:inline-grid;place-items:center;color:var(--muted);font-size:1.1rem}
.icon-btn:hover{background:var(--accent-soft);color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:.7rem;margin-bottom:1rem}
.stats.s3{grid-template-columns:repeat(3,1fr)}
@media (max-width:760px){.stats,.stats.s3{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:.8rem 1rem}
.stat .label{font-size:.78rem;color:var(--muted)}
.stat .value{font-family:var(--serif);font-size:1.45rem;font-weight:600;line-height:1.3}
.stat .sub{font-size:.78rem;color:var(--muted)}
.empty{text-align:center;padding:2rem 1rem;color:var(--muted)}
.empty .big{font-family:var(--serif);font-size:1.15rem;color:var(--text);margin-bottom:.3rem}
.empty .btn{margin:.8rem .25rem 0}
.pill{display:inline-flex;align-items:center;gap:.3rem;font-size:.75rem;font-weight:600;padding:.12rem .6rem;border-radius:999px;background:var(--surface-2);border:1px solid var(--border);color:var(--muted);white-space:nowrap}
.pill.good{background:var(--accent-soft);color:var(--good);border-color:transparent}
.pill.mid{background:var(--mid-soft);color:var(--mid);border-color:transparent}
.pill.info{background:var(--info-soft);color:var(--info);border-color:transparent}
.pill.low{color:var(--low)}
.pill.bad{background:var(--danger-soft);color:var(--danger);border-color:transparent}
.apill{display:inline-block;font-size:.75rem;font-weight:600;padding:.08rem .55rem;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.tag-unpl{display:inline-block;font-size:.7rem;font-weight:600;padding:.08rem .5rem;border-radius:999px;background:var(--accent-2-soft);color:var(--accent-2)}
.mini{display:inline-block;font-size:.72rem;padding:.08rem .5rem;border-radius:999px;margin:.15rem .25rem 0 0}
.mini.m{background:var(--accent-soft);color:var(--accent)}
.mini.o{background:var(--accent-2-soft);color:var(--accent-2)}
.badge{display:inline-flex;align-items:center;gap:.15rem;font-size:.72rem;padding:.05rem .4rem;border-radius:6px;background:var(--surface-2);border:1px solid var(--border);color:var(--muted);font-variant-numeric:tabular-nums}
.badge b{color:var(--text);font-weight:600}

/* Task rows */
.tlist{display:flex;flex-direction:column}
.trow{display:flex;align-items:center;gap:.8rem;padding:.8rem .3rem;border-bottom:1px solid var(--border);cursor:pointer;border-radius:8px;transition:background .12s}
.trow:hover{background:var(--surface-2)}
.trow:last-child{border-bottom:none}
.trow .dot{width:10px;height:10px;border-radius:50%;flex:none;border:2px solid var(--border)}
.trow.s-good .dot{background:var(--good);border-color:var(--good)}
.trow.s-mid .dot{background:var(--mid);border-color:var(--mid)}
.trow.s-info .dot{background:var(--info);border-color:var(--info)}
.trow.s-low .dot{background:var(--low);border-color:var(--low)}
.trow.s-bad .dot{background:var(--danger);border-color:var(--danger)}
.tmain{flex:1;min-width:0}
.tname{font-weight:600}
.tsub{color:var(--muted);font-size:.9rem}
.tmeta{font-size:.8rem;color:var(--muted);margin-top:.2rem;display:flex;gap:.4rem;flex-wrap:wrap;align-items:center}
.datenav{display:flex;align-items:center;gap:.35rem}
.datenav input[type=date]{width:auto}
.toolbar{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.toolbar select{width:auto;padding:.35rem .6rem;border-radius:999px;font-size:.85rem}

/* Fields, chips, scales, durations */
.field{display:block;margin-bottom:1rem}
.field>span,.field-label{display:block;font-size:.82rem;font-weight:600;color:var(--muted);margin-bottom:.35rem}
.field em{font-weight:400;font-style:normal;opacity:.8}
.req{color:var(--danger)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 1rem}
@media (max-width:600px){.grid2{grid-template-columns:1fr}}
.chips{display:flex;flex-wrap:wrap;gap:.35rem}
.chip{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:.3rem .7rem;font-size:.83rem;cursor:pointer;transition:all .12s;color:var(--text);user-select:none}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chips[data-chips*="Out"] .chip.on{background:var(--accent-2);border-color:var(--accent-2);color:#fff}
.chip.static{cursor:default}
.chip.cm{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.chip.cp{color:var(--muted);text-decoration:line-through}
.chip.cx{background:var(--mid-soft);border-color:transparent;color:var(--mid)}
.scale{display:flex;align-items:center;gap:.3rem;flex-wrap:wrap}
.scale button{width:34px;height:34px;border-radius:9px;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-weight:600;font-variant-numeric:tabular-nums}
.scale button:hover{border-color:var(--accent)}
.scale button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.scale-label{font-size:.82rem;color:var(--text);margin-left:.4rem;font-weight:500}
.scale-label.none{color:var(--muted);font-weight:400}
.dur{display:flex;flex-direction:column;gap:.35rem}
.dur input{max-width:220px}
.dur .quick{display:flex;gap:.25rem;flex-wrap:wrap}
.dur .quick button{border:1px solid var(--border);background:transparent;border-radius:7px;padding:.12rem .45rem;font-size:.75rem;cursor:pointer;color:var(--muted)}
.dur .quick button:hover{border-color:var(--accent);color:var(--accent)}
.hint{font-size:.85rem;color:var(--muted);background:var(--surface-2);border:1px dashed var(--border);border-radius:10px;padding:.5rem .7rem;margin:0 0 1rem}
.status-row{display:flex;gap:.35rem;flex-wrap:wrap;margin-bottom:.8rem}
.status-row .sbtn{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:.32rem .8rem;font-size:.85rem;cursor:pointer}
.status-row .sbtn:hover{border-color:var(--sc)}
.status-row .sbtn.on{background:var(--sc);color:#fff;border-color:var(--sc)}

/* Activity picker (version 1 style) */
.picker{border:1px solid var(--border);border-radius:12px;padding:.6rem;background:var(--surface-2)}
.picker.invalid{border-color:var(--danger)}
.picker-list{display:flex;flex-direction:column;max-height:300px;overflow-y:auto;margin-top:.5rem}
.picker-item{display:flex;justify-content:space-between;align-items:center;gap:.6rem;padding:.6rem .5rem;border-radius:10px;cursor:pointer;border:none;background:transparent;text-align:left;width:100%}
.picker-item:hover{background:var(--accent-soft)}
.picker-item .badges{display:flex;gap:.25rem;flex:none}
.picked{display:flex;align-items:center;gap:.8rem;padding:.2rem .3rem}
.picked .aname{font-family:var(--serif);font-size:1.2rem;font-weight:600}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(20,22,20,.45);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:4vh 1rem;overflow-y:auto;animation:fade .15s}
.modal{background:var(--bg);border-radius:18px;width:100%;max-width:700px;box-shadow:0 20px 60px rgba(0,0,0,.25);animation:rise .18s}
.modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:.6rem;padding:1rem 1.2rem .4rem}
.modal-body{padding:.6rem 1.2rem 1rem}
.modal-foot{display:flex;gap:.5rem;align-items:center;padding:.8rem 1.2rem 1.1rem;border-top:1px solid var(--border);position:sticky;bottom:0;background:var(--bg);border-radius:0 0 18px 18px;flex-wrap:wrap}
@media (max-width:600px){.overlay{padding:0}.modal{border-radius:0;min-height:100%}.modal-foot{border-radius:0}}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{transform:translateY(12px);opacity:0}}

/* Charts */
.legend{font-size:.78rem;color:var(--muted);display:flex;gap:1rem;margin-bottom:.6rem;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:.35rem;vertical-align:-1px}
.pr{display:grid;grid-template-columns:160px 1fr;gap:.8rem;align-items:center;padding:.5rem 0;border-bottom:1px dashed var(--border)}
.pr:last-child{border-bottom:none}
.prl{font-size:.85rem;font-weight:600}
.prl small{display:block;font-weight:400;color:var(--muted);font-size:.75rem}
.pb{display:flex;align-items:center;gap:.5rem;height:16px}
.pb+.pb{margin-top:4px}
.pb i{display:block;height:10px;border-radius:5px;transition:width .4s}
.pb span{font-size:.75rem;color:var(--muted);white-space:nowrap}
.bp{background:var(--accent)}.ba{background:var(--mid)}
.bars{display:flex;flex-direction:column;gap:3px;min-width:110px}
.bar{height:8px;border-radius:4px;background:var(--accent);min-width:2px}
.bar.b2{background:var(--mid)}
.donutw{display:flex;gap:1.2rem;align-items:center;flex-wrap:wrap}
.donut{width:130px;height:130px;border-radius:50%;display:grid;place-items:center;flex:none}
.donut i{width:84px;height:84px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-style:normal;text-align:center;font-size:.75rem;color:var(--muted)}
.donut i b{display:block;font-family:var(--serif);font-size:1.4rem;color:var(--text)}
.dleg{display:flex;flex-direction:column;gap:.3rem;font-size:.85rem}
.dleg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:.45rem}
.cgrid{display:grid;grid-template-columns:1.2fr 1fr;gap:1rem}
.tc{display:grid;grid-template-columns:1.2fr 1fr;gap:1.2rem}
@media (max-width:760px){.cgrid,.tc{grid-template-columns:1fr}.pr{grid-template-columns:110px 1fr}}
table.simple{width:100%;border-collapse:collapse;font-size:.88rem}
table.simple th{text-align:left;font-weight:600;color:var(--muted);font-size:.78rem;padding:.4rem .5rem;border-bottom:1px solid var(--border)}
table.simple td{padding:.5rem;border-bottom:1px solid var(--border);vertical-align:middle}
table.simple tr:last-child td{border-bottom:none}
.table-wrap{overflow-x:auto}

/* Filters */
.filters{display:flex;gap:.8rem;align-items:flex-end;flex-wrap:wrap}
.filters .f{display:flex;flex-direction:column}
.filters .f>label{font-size:.78rem;font-weight:600;color:var(--muted);margin-bottom:.3rem}
.filters input[type=date]{width:auto;padding:.4rem .6rem}
.seg{display:inline-flex;gap:.25rem;flex-wrap:wrap}
.seg button{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:.32rem .75rem;font-size:.82rem;cursor:pointer}
.seg button:hover{border-color:var(--accent)}
.seg button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ms{position:relative}
.msbtn{border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:.42rem .75rem;cursor:pointer;min-width:220px;text-align:left;display:flex;justify-content:space-between;gap:.6rem}
.mspanel{position:absolute;top:calc(100% + 6px);left:0;z-index:15;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:0 14px 40px rgba(0,0,0,.15);padding:.4rem;width:290px;max-height:340px;overflow:auto}
.mspanel label{display:flex;align-items:center;gap:.55rem;padding:.42rem .5rem;border-radius:8px;cursor:pointer;font-size:.9rem}
.mspanel label:hover{background:var(--accent-soft)}
.mspanel input{accent-color:var(--accent);width:16px;height:16px}
.mspanel .all{border-bottom:1px solid var(--border);font-weight:600;margin-bottom:.2rem;padding-bottom:.55rem}
@media (max-width:760px){.filters .f,.filters .ms{flex:1 1 140px}.filters input[type=date],.msbtn{width:100%;min-width:0}}

/* Activities */
.lib-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:.8rem}
.acard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1rem;display:flex;flex-direction:column;gap:.4rem;cursor:pointer;transition:border-color .15s,transform .15s}
.acard:hover{border-color:var(--accent);transform:translateY(-1px)}
.acard.inactive{opacity:.6}
.acard h3{display:flex;justify-content:space-between;gap:.5rem}
.acard .desc{font-size:.85rem;color:var(--muted)}
.acard .meta{font-size:.8rem;color:var(--muted)}
.notice{border-radius:12px;padding:.75rem 1rem;font-size:.9rem;margin-bottom:1rem}
.notice.warn{background:var(--mid-soft);color:var(--text)}
.notice.ok{background:var(--accent-soft);color:var(--text)}
.mrow{display:flex;gap:.5rem;align-items:center;padding:.35rem 0;border-bottom:1px solid var(--border)}
.mrow span{flex:1}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,30px);background:var(--text);color:var(--bg);padding:.55rem 1rem;border-radius:999px;font-size:.88rem;opacity:0;pointer-events:none;transition:all .2s;z-index:100}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:760px){#toast{bottom:84px}}
details summary{cursor:pointer;font-size:.85rem;font-weight:600;color:var(--accent)}
</style>

<script>
'use strict';
/* =====================================================================
   CONSTANTS
   ===================================================================== */
const VERSION='2.1';
const ADMIN_USER='ADMIN', ADMIN_PASS='2409';
const STATUSES=[
  {k:'',            t:'Not recorded',          tone:'',    col:'#cfcac0'},
  {k:'asplanned',   t:'Completed as planned',  tone:'good',col:'#5b7f6a'},
  {k:'differently', t:'Completed differently', tone:'info',col:'#4f7896'},
  {k:'partial',     t:'Partially done',        tone:'mid', col:'#b88a3e'},

const NOT_DONE=['postponed','skipped','cancelled'];
/* Rating meanings (same wording as version 1) */
const SCALES={
  importance:  {label:'Priority',             d:['Very low','Low','Medium','High','Very high']},
  effort:      {label:'Mental effort',        d:['Very low','Low','Moderate','High','Very high']},

/* Motives and outcomes from version 1 */
const DEF_MOTIVES=['Resolve / remove something bothering me','Maintain / take care of something','Enjoyment','Fun / entertainment','Relaxation / restoration','Personal growth','Career development','Learning / knowledge','Creativity / creating something','Relationships / connection','Experience','Travel','Exploration','Culture / understanding','Financial benefit','Health / wellbeing','Luxury / indulgence','Contribution / helping others','Because I want to'];
const DEF_OUTCOMES=['Fun','Entertainment','Relaxation','Mental clarity','Emotional wellbeing','Stress reduction','Knowledge','Understanding','Personal growth','Career benefit','Skill development','Confidence','Sense of accomplishment','Creativity','Connection','Physical wellbeing','Financial benefit','New experience','Cultural understanding','Reduced mental clutter','Problem solved','Something created','Because I enjoy the experience itself'];
/* Activities from version 1: [name, description, priority, minutes, mental, resistance, motives, outcomes] */
const DEF_ACTS=[
  ['Watch Movies','Films of any kind — entertainment, documentaries, classics.',2,120,1,1,['Enjoyment','Fun / entertainment','Culture / understanding','Exploration','Because I want to'],['Entertainment','Relaxation','Cultural understanding','Because I enjoy the experience itself']],
  ['Watch Series','An episode or a few of a show I am following.',2,60,1,1,['Fun / entertainment','Relaxation / restoration','Because I want to'],['Entertainment','Relaxation']],
  ['Read Books','Fiction or non-fiction, paper or screen.',4,45,3,2,['Learning / knowledge','Personal growth','Enjoyment'],['Knowledge','Understanding','Personal growth']],
  ['Exercise','Walk, workout, yoga, sport.',4,45,2,3,['Health / wellbeing','Maintain / take care of something'],['Physical wellbeing','Stress reduction','Mental clarity']],
  ['Travel','Trips near or far.',3,480,2,2,['Travel','Experience','Exploration'],['New experience','Cultural understanding']],
  ['Learn a Skill','Deliberate practice of something new.',4,60,4,3,['Personal growth','Learning / knowledge','Career development'],['Skill development','Confidence']],
  ['Personal Project','Something I am building or making for myself.',3,90,4,2,['Creativity / creating something','Personal growth','Because I want to'],['Something created','Sense of accomplishment','Creativity']],
  ['Journaling','Writing things down to think clearly.',3,15,2,2,['Personal growth','Relaxation / restoration'],['Mental clarity','Emotional wellbeing','Reduced mental clutter']],
  ['Spend Time With Friends','Meeting, calling or doing something together.',4,120,1,1,['Relationships / connection','Enjoyment'],['Connection','Emotional wellbeing','Fun']],
  ['Spend Time With Family','Unhurried time with family.',5,120,1,1,['Relationships / connection','Maintain / take care of something'],['Connection','Emotional wellbeing']],
  ['Explore a New Place','A new street, café, museum, park or town.',3,180,2,2,['Exploration','Experience'],['New experience']],
  ['Learn About History','Books, videos, places, podcasts.',3,60,3,2,['Learning / knowledge','Culture / understanding'],['Knowledge','Understanding','Cultural understanding']],
  ['Learn About Culture','Food, music, languages, traditions.',3,60,2,1,['Culture / understanding','Exploration'],['Cultural understanding','Understanding']],
  ['Home Maintenance','Repairs, cleaning, organising.',3,60,2,4,['Maintain / take care of something','Resolve / remove something bothering me'],['Problem solved','Reduced mental clutter','Sense of accomplishment']],
  ['Personal Administration','Bills, paperwork, banking, appointments.',4,30,3,4,['Resolve / remove something bothering me','Maintain / take care of something','Financial benefit'],['Problem solved','Reduced mental clutter']]
];
const LISTS_VERSION=4;

const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const nowISO=()=>new Date().toISOString();
const dstr=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const today=()=>dstr(new Date());
const addDays=(s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return dstr(d)};
const dayDiff=s=>Math.round((new Date(s+'T00:00:00')-new Date(today()+'T00:00:00'))/864e5);
const relLabel=s=>{const d=dayDiff(s);return d===0?'Today':d===1?'Tomorrow':d===-1?'Yesterday':d>1?`In ${d} days`:`${-d} days ago`};
const fmtLong=s=>new Date(s+'T00:00:00').toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const nice=s=>new Date(s+'T00:00:00').toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmtMin(m){if(m===null||m===undefined||m===''||isNaN(+m))return '—';m=Math.round(+m);const neg=m<0;m=Math.abs(m);const h=Math.floor(m/60),r=m%60;return (neg?'-':'')+(h?(r?`${h}h ${r}m`:`${h}h`):`${r}m`)}
/* Accepts "90", "1:30", "1h", "1h 30m", "1.5h", "45m". Returns minutes, null if blank, NaN if not understood. */
function parseDuration(s){
  s=String(s??'').trim().toLowerCase();if(!s)return null;let m;
  if(/^\d+$/.test(s))return +s;
  if((m=s.match(/^(\d+):(\d{1,2})$/)))return +m[1]*60+ +m[2];
  m=s.match(/^(?:(\d+(?:\.\d+)?)\s*h(?:r|rs|our|ours)?)?\s*(?:(\d+)\s*m(?:in|ins|inute|inutes)?)?$/);
  if(m&&(m[1]||m[2]))return Math.round(parseFloat(m[1]||0)*60+parseInt(m[2]||0,10));
  return NaN;
}
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
const f1=v=>v==null||isNaN(v)?'—':(Math.round(v*10)/10).toString();
const pct=v=>v==null||isNaN(v)?'—':Math.round(v*100)+'%';
const stInfo=k=>STATUSES.find(s=>s.k===(k||''))||STATUSES[0];
const stIdx=k=>Math.max(0,STATUSES.findIndex(s=>s.k===(k||'')));
const stLabel=t=>t.unplanned&&t.actual.status==='asplanned'?'Done':stInfo(t.actual.status).t;
const scaleTxt=(kind,v)=>v?`${v} · ${SCALES[kind].d[v-1]}`:'—';

function makeActivities(){
  const t=nowISO();
  return DEF_ACTS.map(a=>({id:uid(),name:a[0],description:a[1],importance:a[2],minutes:a[3],effort:a[4],resistance:a[5],motives:a[6].slice(),outcomes:a[7].slice(),active:true,created:t,history:[]}));
}
function defaultData(){
  return {version:2,listsVersion:LISTS_VERSION,created:nowISO(),activities:makeActivities(),tasks:[],motives:DEF_MOTIVES.slice(),outcomes:DEF_OUTCOMES.slice(),settings:{hoursPerDay:''}};
}
let normalisedChanged=false;
function normalise(d){
  d=d&&typeof d==='object'?d:defaultData();
  d.activities=d.activities||[];d.tasks=d.tasks||[];d.motives=d.motives||[];d.outcomes=d.outcomes||[];d.settings=d.settings||{};
  if((d.listsVersion||0)<LISTS_VERSION){
    /* One-time upgrade: add every version-1 motive, outcome and activity that is missing. Nothing the user made is removed. */
    DEF_MOTIVES.forEach(m=>{if(!d.motives.includes(m))d.motives.push(m)});
    DEF_OUTCOMES.forEach(o=>{if(!d.outcomes.includes(o))d.outcomes.push(o)});
    const have=new Set(d.activities.map(a=>a.name.toLowerCase()));
    makeActivities().forEach(a=>{if(!have.has(a.name.toLowerCase()))d.activities.push(a)});
    d.listsVersion=LISTS_VERSION;normalisedChanged=true;
  }
  d.activities.forEach(a=>{a.history=a.history||[];a.motives=a.motives||[];a.outcomes=a.outcomes||[];if(a.active===undefined)a.active=true;if(a.description==null)a.description=a.notes||''});
  d.tasks.forEach(t=>{t.plan=t.plan||{};t.actual=t.actual||{};t.plan.motives=t.plan.motives||[];t.plan.outcomes=t.plan.outcomes||[];t.actual.motives=t.actual.motives||[];t.actual.outcomes=t.actual.outcomes||[]});
  return d;
}

/* =====================================================================
   PASSWORDS (local mode)
   ===================================================================== */
async function hashPw(salt,pw){
  const s=salt+'|'+pw;
  if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('')}
  let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return 'f'+(h>>>0).toString(16);
}

/* =====================================================================
   LOCAL STORE — this browser only
   ===================================================================== */
const LocalStore={
  mode:'local',canResetPasswords:true,
  K_USERS:'viana2_users',K_SESS:'viana2_session',
  users(){try{return JSON.parse(localStorage.getItem(this.K_USERS))||{}}catch(e){return {}}},
  putUsers(u){localStorage.setItem(this.K_USERS,JSON.stringify(u))},
  async init(){const s=sessionStorage.getItem(this.K_SESS);return s?JSON.parse(s):null},
  remember(s){sessionStorage.setItem(this.K_SESS,JSON.stringify(s))},
  async signUp(username,pw){
    const key=username.toLowerCase();
    if(key===ADMIN_USER.toLowerCase())throw new Error('That username is reserved.');
    const u=this.users();if(u[key])throw new Error('That username is already taken.');
    const salt=uid();u[key]={username,salt,hash:await hashPw(salt,pw),created:nowISO(),disabled:false};
    this.putUsers(u);localStorage.setItem('viana2_data_'+key,JSON.stringify(defaultData()));
    const s={id:key,username,isAdmin:false};this.remember(s);return s;
  },
  async signIn(username,pw){
    if(username.toUpperCase()===ADMIN_USER){
      if(pw!==ADMIN_PASS)throw new Error('Incorrect username or password.');
      const s={id:'__admin__',username:ADMIN_USER,isAdmin:true};this.remember(s);return s;
    }
    const key=username.toLowerCase(),r=this.users()[key];
    if(!r||r.hash!==await hashPw(r.salt,pw))throw new Error('Incorrect username or password.');
    if(r.disabled)throw new Error('This account has been disabled by the admin.');
    const s={id:key,username:r.username,isAdmin:false};this.remember(s);return s;
  },
  async signOut(){sessionStorage.removeItem(this.K_SESS)},
  async load(id){try{return normalise(JSON.parse(localStorage.getItem('viana2_data_'+id)))}catch(e){return normalise(null)}},
  async save(id,data){localStorage.setItem('viana2_data_'+id,JSON.stringify(data))},
  async listUsers(){
    const u=this.users();
    return Object.keys(u).map(k=>{let n=0;try{n=(JSON.parse(localStorage.getItem('viana2_data_'+k))||{tasks:[]}).tasks.length}catch(e){}
      return {id:k,username:u[k].username,created:u[k].created,disabled:!!u[k].disabled,tasks:n}});
  },
  async setDisabled(id,v){const u=this.users();if(u[id]){u[id].disabled=v;this.putUsers(u)}},
  async deleteUser(id){const u=this.users();delete u[id];this.putUsers(u);localStorage.removeItem('viana2_data_'+id)},
  async resetPassword(id,pw){const u=this.users();if(!u[id])return;u[id].salt=uid();u[id].hash=await hashPw(u[id].salt,pw);this.putUsers(u)},
  async changePassword(id,oldpw,newpw){
    const u=this.users(),r=u[id];if(!r)throw new Error('The admin password is fixed.');
    if(r.hash!==await hashPw(r.salt,oldpw))throw new Error('Current password is incorrect.');
    r.salt=uid();r.hash=await hashPw(r.salt,newpw);this.putUsers(u);
  }
};

/* =====================================================================
   CLOUD STORE — Firebase Auth + Firestore
   ===================================================================== */
const EMAIL_DOMAIN='@viana.app';
const cloudPw=p=>p+'#viana';
const CloudStore={
  mode:'cloud',canResetPasswords:false,
  async init(cfg){
    firebase.initializeApp(cfg);
    this.auth=firebase.auth();this.db=firebase.firestore();
    await this.auth.setPersistence(firebase.auth.Auth.Persistence.SESSION);
    const user=await new Promise(r=>{const un=this.auth.onAuthStateChanged(u=>{un();r(u)})});
    if(!user)return null;
    try{return await this.sessionFor(user)}catch(e){return null}
  },
  async sessionFor(user){
    const isAdmin=user.email===ADMIN_USER.toLowerCase()+EMAIL_DOMAIN;
    const ref=this.db.collection('users').doc(user.uid);
    let snap;
    try{
      snap=await ref.get();
      if(!snap.exists){ /* also repairs an account whose record was not written at sign-up */
        const uname=isAdmin?ADMIN_USER:(user.displayName||user.email.replace(EMAIL_DOMAIN,''));
        await ref.set({username:uname,created:nowISO(),disabled:false,isAdmin,data:JSON.stringify(defaultData())});
        snap=await ref.get();
      }
    }catch(e){throw new Error(this.friendly(e))}
    const d=snap.data();
    if(d.disabled&&!isAdmin){await this.auth.signOut();throw new Error('This account has been disabled by the admin.')}
    return {id:user.uid,username:d.username,isAdmin};
  },
  friendly(e){
    const c=(e&&e.code)||'';
    if(/invalid-credential|wrong-password|user-not-found|invalid-login/.test(c))return 'Incorrect username or password.';
    if(/email-already-in-use/.test(c))return 'That username is already taken.';
    if(/network|unavailable/.test(c))return 'No internet connection. Please try again.';
    if(/operation-not-allowed/.test(c))return 'Email/Password sign-in is not enabled in Firebase (Authentication → Sign-in method).';
    if(/permission-denied|insufficient/.test(c))return 'Firebase security rules are blocking this. Paste the latest firestore.rules into Firebase → Firestore → Rules and press Publish.';
    if(/unauthorized-domain/.test(c))return 'This website is not in Firebase → Authentication → Settings → Authorized domains.';
    if(/too-many-requests/.test(c))return 'Too many attempts. Wait a few minutes and try again.';
    return (e&&e.message)||String(e);
  },
  async signUp(username,pw){
    if(username.toUpperCase()===ADMIN_USER)throw new Error('That username is reserved.');
    if(!/^[A-Za-z0-9._-]+$/.test(username))throw new Error('Use only letters, numbers, dot, dash or underscore in the username.');
    let cr;
    try{cr=await this.auth.createUserWithEmailAndPassword(username.toLowerCase()+EMAIL_DOMAIN,cloudPw(pw))}catch(e){throw new Error(this.friendly(e))}
    try{
      await cr.user.updateProfile({displayName:username});
      await this.db.collection('users').doc(cr.user.uid).set({username,created:nowISO(),disabled:false,isAdmin:false,data:JSON.stringify(defaultData())});
    }catch(e){throw new Error('Your login was created but your record could not be saved: '+this.friendly(e))}
    return {id:cr.user.uid,username,isAdmin:false};
  },
  async signIn(username,pw){
    const isAdmin=username.toUpperCase()===ADMIN_USER;
    if(isAdmin&&pw!==ADMIN_PASS)throw new Error('Incorrect username or password.');
    const email=username.toLowerCase()+EMAIL_DOMAIN;
    let cr;
    try{cr=await this.auth.signInWithEmailAndPassword(email,cloudPw(pw))}
    catch(e){
      if(isAdmin){ /* first-ever admin sign-in creates the admin login */
        try{cr=await this.auth.createUserWithEmailAndPassword(email,cloudPw(pw))}
        catch(e2){throw new Error(this.friendly(/email-already-in-use/.test(e2.code||'')?e:e2))}
      }else throw new Error(this.friendly(e));
    }
    return await this.sessionFor(cr.user);
  },
  async signOut(){await this.auth.signOut()},
  async load(id){const s=await this.db.collection('users').doc(id).get();if(!s.exists)return normalise(null);let d=null;try{d=JSON.parse(s.data().data)}catch(e){}return normalise(d)},
  async save(id,data){await this.db.collection('users').doc(id).set({data:JSON.stringify(data),updated:nowISO()},{merge:true})},
  async listUsers(){
    const q=await this.db.collection('users').get();const out=[];
    q.forEach(doc=>{const d=doc.data();if(d.isAdmin)return;let n=0;try{n=JSON.parse(d.data).tasks.length}catch(e){}
      out.push({id:doc.id,username:d.username,created:d.created,updated:d.updated,disabled:!!d.disabled,tasks:n})});
    return out;
  },
  async setDisabled(id,v){await this.db.collection('users').doc(id).set({disabled:v},{merge:true})},
  async deleteUser(id){await this.db.collection('users').doc(id).delete()},
  async resetPassword(){throw new Error('In cloud mode, reset passwords from the Firebase console (Authentication → Users).')},
  async changePassword(id,oldpw,newpw){
    const u=this.auth.currentUser;
    try{const cred=firebase.auth.EmailAuthProvider.credential(u.email,cloudPw(oldpw));await u.reauthenticateWithCredential(cred);await u.updatePassword(cloudPw(newpw))}
    catch(e){throw new Error(this.friendly(e))}
  }
};
let Store=LocalStore;
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('Could not load Firebase from the internet'));document.head.appendChild(s)})}

/* Finds the Firebase settings however firebase-config.js was written */
async function findConfig(){
  const ok=c=>c&&typeof c==='object'&&c.apiKey&&!/PASTE|YOUR_/i.test(c.apiKey)?c:null;
  let c=ok(window.VIANA_FIREBASE_CONFIG)||ok(window.firebaseConfig)||ok(window.FIREBASE_CONFIG);
  try{if(!c&&typeof firebaseConfig!=='undefined')c=ok(firebaseConfig)}catch(e){}
  try{if(!c&&typeof FIREBASE_CONFIG!=='undefined')c=ok(FIREBASE_CONFIG)}catch(e){}
  if(c)return c;
  /* Last resort: read the file text (handles the "import …" snippet copied from the Firebase console) */
  if(window.__vianaCfgMissing||location.protocol==='file:')return null;
  try{
    const r=await fetch('firebase-config.js',{cache:'no-store'});if(!r.ok)return null;
    const txt=(await r.text()).replace(/\/\/.*$/gm,'').replace(/\/\*[\s\S]*?\*\//g,'');
    const out={};['apiKey','authDomain','projectId','storageBucket','messagingSenderId','appId','measurementId'].forEach(k=>{
      const m=txt.match(new RegExp('["\']?'+k+'["\']?\\s*:\\s*["\']([^"\']+)["\']'));if(m)out[k]=m[1]});
    return ok(out)&&out.projectId?out:null;
  }catch(e){return null}
}

let S=null,D=null,viewing=null,tab='today';
let saveTimer=null,pending=null;
const ui={planDate:null,reviewDate:null,reviewSort:'status',cmpFrom:null,cmpTo:null,cmpActs:null,msOpen:false,
  anFrom:null,anTo:null,anAll:false,adminUsers:[],libQ:'',libStatus:'active'};
const dataOwner=()=>viewing?viewing.id:S.id;
function save(){
  pending={owner:dataOwner(),data:D};
  if(Store.mode==='local'){flushSave();return}
  clearTimeout(saveTimer);saveTimer=setTimeout(flushSave,400);
}
async function flushSave(){
  clearTimeout(saveTimer);saveTimer=null;
  if(!pending)return;const p=pending;pending=null;
  try{await Store.save(p.owner,p.data)}catch(e){toast('Could not save: '+(Store.friendly?Store.friendly(e):e.message))}
}
let toastTimer;
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2000)}
window.addEventListener('pagehide',()=>{flushSave()});
/* Cloud mode: pick up changes made on another device when you return to this tab */
document.addEventListener('visibilitychange',async()=>{
  if(document.visibilityState!=='visible'||!S||Store.mode!=='cloud'||pending||document.getElementById('modal-root').innerHTML)return;
  try{const fresh=await Store.load(dataOwner());if(JSON.stringify(fresh)!==JSON.stringify(D)){D=fresh;render()}}catch(e){}
});

/* =====================================================================
   AUTH
   ===================================================================== */
let authMode='in';
function authTab(m){
  authMode=m;
  document.getElementById('tabIn').classList.toggle('on',m==='in');
  document.getElementById('tabUp').classList.toggle('on',m==='up');
  document.getElementById('aPass2Wrap').classList.toggle('hidden',m!=='up');
  document.getElementById('authBtn').textContent=m==='in'?'Sign in':'Create account';
  document.getElementById('aPass').autocomplete=m==='in'?'current-password':'new-password';
  document.getElementById('authErr').textContent='';
}
async function doAuth(ev){
  ev.preventDefault();
  const u=document.getElementById('aUser').value.trim(),p=document.getElementById('aPass').value,err=document.getElementById('authErr'),btn=document.getElementById('authBtn');
  err.textContent='';
  if(!u||!p){err.textContent='Enter username and password.';return false}
  if(authMode==='up'){
    if(u.length<3){err.textContent='Username must be at least 3 characters.';return false}
    if(p.length<4){err.textContent='Password must be at least 4 characters.';return false}
    if(p!==document.getElementById('aPass2').value){err.textContent='Passwords do not match.';return false}
  }
  btn.disabled=true;btn.textContent='Please wait…';
  try{
    S=authMode==='in'?await Store.signIn(u,p):await Store.signUp(u,p);
    document.getElementById('authForm').reset();
    await enterApp();
    if(authMode==='up')toast('Account created. Welcome, '+S.username+'!');
  }catch(e){err.textContent=e.message||String(e)}
  btn.disabled=false;btn.textContent=authMode==='in'?'Sign in':'Create account';
  return false;
}
async function enterApp(){
  viewing=null;normalisedChanged=false;D=await Store.load(S.id);tab='today';
  if(normalisedChanged)save();
  document.getElementById('auth').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('whoName').textContent=S.username;
  document.getElementById('adminTag').classList.toggle('hidden',!S.isAdmin);
  const mt=document.getElementById('modeTag');
  mt.innerHTML=Store.mode==='cloud'?'☁<span class="mtx"> Synced</span>':'📱<span class="mtx"> This device only</span>';
  mt.className='mode'+(Store.mode==='cloud'?'':' local');
  mt.title=Store.mode==='cloud'?'Saved to Firebase – available on any device':'Saved only in this browser. Fill in firebase-config.js to sync.';
  render();
}
async function signOut(){
  await flushSave();
  try{await Store.signOut()}catch(e){}
  S=null;D=null;viewing=null;closeModal();
  document.getElementById('app').classList.add('hidden');
  document.getElementById('auth').classList.remove('hidden');
  authTab('in');
}

const TABS=[['today','Today'],['plan','Plan'],['review','Review'],['compare','Compare'],['analysis','Analysis'],['activities','Activities'],['settings','Settings']];
function render(){
  if(!S)return;

function go(t){tab=t;ui.msOpen=false;render();window.scrollTo(0,0)}
const actById=id=>D.activities.find(a=>a.id===id);
const actName=id=>(actById(id)||{}).name||'(deleted activity)';
const taskName=t=>t.name||actName(t.activityId);
const tasksOn=d=>D.tasks.filter(t=>t.date===d);
function sortTasks(list,mode){
  const imp=t=>+t.plan.importance||0;
  const by={
    status:(a,b)=>stIdx(a.actual.status)-stIdx(b.actual.status)||imp(b)-imp(a)||taskName(a).localeCompare(taskName(b)),
    priority:(a,b)=>imp(b)-imp(a)||stIdx(a.actual.status)-stIdx(b.actual.status)||taskName(a).localeCompare(taskName(b)),
    activity:(a,b)=>actName(a.activityId).localeCompare(actName(b.activityId))||imp(b)-imp(a),
    name:(a,b)=>taskName(a).localeCompare(taskName(b))
  };
  return list.slice().sort(by[mode]||by.status);
}
const badge=(letter,v,title)=>`<span class="badge" title="${esc(title)}${v?': '+esc(v+' – '+(SCALES[letter==='P'?'importance':letter==='M'?'effort':'resistance'].d[v-1])):': not set'}">${letter}<b>${v??'–'}</b></span>`;
const stPill=t=>{const s=stInfo(t.actual.status);return `<span class="pill ${s.tone}">${esc(stLabel(t))}</span>`};
function taskRow(t,click){
  const s=stInfo(t.actual.status);
  const meta=[`<span class="apill">${esc(actName(t.activityId))}</span>`];
  if(t.unplanned)meta.push('<span class="tag-unpl">Unplanned</span>');else meta.push('Plan '+fmtMin(t.plan.minutes));
  if(DONE_KEYS.includes(t.actual.status)&&t.actual.minutes!=null)meta.push('Actual '+fmtMin(t.actual.minutes));
  if(!t.unplanned&&t.plan.importance)meta.push(`Priority: ${esc(SCALES.importance.d[t.plan.importance-1])}`);
  return `<div class="trow s-${s.tone}" onclick="${click}('${t.id}')"><span class="dot"></span><div class="tmain"><div class="tname">${esc(taskName(t))}</div>
    <div class="tmeta">${meta.join('<span>·</span>')}</div></div>${stPill(t)}</div>`;
}
function totals(list){let p=0,a=0;list.forEach(t=>{if(!t.unplanned)p+=+t.plan.minutes||0;if(DONE_KEYS.includes(t.actual.status))a+=+t.actual.minutes||0});return {p,a}}
const stat=(label,value,sub='')=>`<div class="stat"><div class="label">${label}</div><div class="value">${value}</div>${sub?`<div class="sub">${sub}</div>`:''}</div>`;
const emptyBox=(big,txt,extra='')=>`<div class="empty"><div class="big">${big}</div>${txt}${extra?`<div>${extra}</div>`:''}</div>`;
function dateNav(key,val){
  return `<div class="datenav"><button class="icon-btn" onclick="ui.${key}=addDays(ui.${key},-1);render()" aria-label="Previous day">‹</button>
  <input type="date" value="${val}" onchange="ui.${key}=this.value||today();render()">
  <button class="icon-btn" onclick="ui.${key}=addDays(ui.${key},1);render()" aria-label="Next day">›</button>
  ${val!==today()?`<button class="btn sm ghost" onclick="ui.${key}=today();render()">Today</button>`:''}</div>`;
}

/* ---------- TODAY ---------- */
function vToday(m){
  const d=today(),list=sortTasks(tasksOn(d),'status'),tt=totals(list);
  const done=list.filter(t=>DONE_KEYS.includes(t.actual.status)).length,left=list.filter(t=>!t.actual.status).length;
  const h=new Date().getHours(),greet=h<5?'Late night':h<12?'Good morning':h<17?'Good afternoon':'Good evening';
  const tm=tasksOn(addDays(d,1));
  m.innerHTML=`<section class="page-head"><div><div class="eyebrow">Today</div><h1>${fmtLong(d)}</h1><p class="lede">${greet}, ${esc((viewing||S).username)}. How would you like to spend today?</p></div>
    <div class="head-actions"><button class="btn" onclick="openUnplanned('${d}')">+ Something unplanned</button><button class="btn primary" onclick="ui.reviewDate=today();go('review')">Review the day</button></div></section>
  <div class="stats">${stat('Planned time',fmtMin(tt.p),`${list.filter(t=>!t.unplanned).length} planned task(s)`)}${stat('Actual time',tt.a?fmtMin(tt.a):'—','where recorded')}
    ${stat('Completed',`${done}<span class="muted" style="font-size:1rem"> / ${list.length}</span>`)}${stat('Not yet recorded',left)}</div>
  <section class="card"><div class="card-head"><h2>Today's tasks</h2><button class="btn sm ghost" onclick="openPlan(null,today())">+ Plan a task</button></div>
    ${list.length?`<div class="tlist">${list.map(t=>taskRow(t,'openActual')).join('')}</div>`:emptyBox('Nothing planned for today.','That\'s fine too. You can plan a little, or record what you do as you go.',`<button class="btn" onclick="openPlan(null,today())">Plan today</button><button class="btn" onclick="openUnplanned(today())">Record something I did</button>`)}</section>
  <section class="card soft"><div class="card-head" style="margin:0"><div><div class="eyebrow">Tomorrow</div><div>${tm.length?`${tm.length} task(s) · ${fmtMin(totals(tm).p)} planned`:'<span class="muted">Not planned yet</span>'}</div></div>
    <button class="btn primary" onclick="ui.planDate=addDays(today(),1);go('plan')">Plan tomorrow →</button></div></section>`;
}

/* ---------- PLAN ---------- */
function vPlan(m){
  const d=ui.planDate||(ui.planDate=addDays(today(),1)),list=sortTasks(tasksOn(d).filter(t=>!t.unplanned),'priority'),tt=totals(list);
  const cap=(+D.settings.hoursPerDay||0)*60;
  const fav=D.activities.filter(a=>a.active).map(a=>({a,n:D.tasks.filter(t=>t.activityId===a.id).length})).sort((x,y)=>y.n-x.n||(y.a.importance||0)-(x.a.importance||0)||x.a.name.localeCompare(y.a.name)).slice(0,8).map(x=>x.a);
  m.innerHTML=`<section class="page-head"><div><div class="eyebrow">Plan · ${relLabel(d)}</div><h1>${fmtLong(d)}</h1><p class="lede">How do I want to spend this day?</p></div>${dateNav('planDate',d)}</section>
  <section class="card"><div class="card-head"><h2>Planned</h2><button class="btn primary" onclick="openPlan(null,ui.planDate)">+ Add a task</button></div>
    ${list.length?`<div class="tlist">${list.map(t=>taskRow(t,'openPlan')).join('')}</div>`:emptyBox('An open day.','Add a few things you would like to give time to.')}
    ${fav.length?`<div style="margin-top:.9rem"><div class="field-label">Quick add</div><div class="chips">${fav.map(a=>`<button class="chip" onclick="openPlan(null,ui.planDate,'${a.id}')">+ ${esc(a.name)}</button>`).join('')}</div></div>`:''}</section>
  ${list.length?`<section class="card"><h2 style="margin-bottom:.6rem">Time allocation</h2>
    ${list.map(t=>`<div class="row" style="justify-content:space-between;color:var(--muted);padding:.15rem 0"><span>${esc(taskName(t))} <span class="small">· ${esc(actName(t.activityId))}</span></span><span>${fmtMin(t.plan.minutes)}</span></div>`).join('')}
    <div class="row" style="justify-content:space-between;border-top:1px solid var(--border);margin-top:.4rem;padding-top:.5rem;font-weight:600"><span>Total planned</span><span>${fmtMin(tt.p)}</span></div>
    ${cap?`<div class="row muted" style="justify-content:space-between"><span>Of ${fmtMin(cap)} available</span><span>${tt.p<=cap?fmtMin(cap-tt.p)+' unallocated':fmtMin(tt.p-cap)+' over'}</span></div>`:''}</section>`:''}`;
}

/* ---------- form helpers ---------- */
const field=(label,inner,cls='')=>`<div class="field ${cls}"><span>${label}</span>${inner}</div>`;
function chips(name,all,sel){
  const extra=sel.filter(x=>!all.includes(x));
  return `<div class="chips" data-chips="${name}">`+[...all,...extra].map(x=>`<span class="chip ${sel.includes(x)?'on':''}" data-v="${esc(x)}" onclick="this.classList.toggle('on')">${esc(x)}</span>`).join('')+`</div>`;
}
function readChips(name){return [...document.querySelectorAll(`[data-chips="${name}"] .chip.on`)].map(c=>c.dataset.v)}
function setChips(name,list){document.querySelectorAll(`[data-chips="${name}"] .chip`).forEach(c=>c.classList.toggle('on',list.includes(c.dataset.v)))}
function scale(name,kind,val){
  const sc=SCALES[kind];
  return `<div class="scale" data-seg="${name}" data-kind="${kind}">`+[1,2,3,4,5].map(n=>
    `<button type="button" class="${+val===n?'on':''}" title="${n} · ${esc(sc.d[n-1])}" onclick="segPick(this)">${n}</button>`).join('')+
    `<span class="scale-label ${val?'':'none'}">${val?esc(sc.d[val-1]):'not set'}</span></div>`;
}
function segPick(b){const on=b.classList.contains('on'),box=b.parentNode;box.querySelectorAll('button').forEach(x=>x.classList.remove('on'));if(!on)b.classList.add('on');setDesc(box)}
function setDesc(box){const v=readSeg(box.dataset.seg),el=box.querySelector('.scale-label');el.textContent=v?SCALES[box.dataset.kind].d[v-1]:'not set';el.classList.toggle('none',!v)}
function readSeg(name){const b=document.querySelector(`[data-seg="${name}"] button.on`);return b?+b.textContent:null}
function setSeg(name,v){const box=document.querySelector(`[data-seg="${name}"]`);if(!box)return;box.querySelectorAll('button').forEach(x=>x.classList.toggle('on',+x.textContent===+v));setDesc(box)}
function dur(id,min){
  return `<div class="dur"><input type="text" id="${id}" placeholder="e.g. 90, 1:30, 1h 30m" value="${min!=null&&min!==''?fmtMin(min):''}" oninput="this.classList.remove('invalid')">
  <div class="quick">${[15,30,45,60,90,120,180].map(m=>`<button type="button" onclick="setDur('${id}',${m})">${fmtMin(m)}</button>`).join('')}</div></div>`;
}
function setDur(id,m){const el=document.getElementById(id);el.value=m==null||m===''?'':fmtMin(m);el.classList.remove('invalid')}
function readDur(id){const el=document.getElementById(id);const v=parseDuration(el.value);el.classList.toggle('invalid',Number.isNaN(v));return v}

/* ---------- modal ---------- */
function openModal(title,sub,body,footer){
  const root=document.getElementById('modal-root');
  root.innerHTML=`<div class="overlay"><div class="modal" role="dialog" aria-modal="true"><div class="modal-head"><div style="min-width:0">${title}${sub?`<div class="muted small">${sub}</div>`:''}</div><button class="icon-btn" onclick="closeModal()" aria-label="Close">✕</button></div>
  <div class="modal-body">${body}</div>${footer?`<div class="modal-foot">${footer}</div>`:''}</div></div>`;
  const ov=root.querySelector('.overlay');ov.addEventListener('mousedown',e=>{if(e.target===ov)closeModal()});
  document.body.classList.add('modal-open');
}
function closeModal(){document.getElementById('modal-root').innerHTML='';document.body.classList.remove('modal-open')}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

/* ---------- activity picker (version 1 style list) ---------- */
let pk={id:null,onPick:null};
function renderPicker(open){
  const box=document.getElementById('pkBox');if(!box)return;
  const cur=pk.id&&actById(pk.id);
  if(!open&&cur){
    box.innerHTML=`<div class="picker"><div class="picked"><div style="flex:1;min-width:0"><div class="aname">${esc(cur.name)}</div>${cur.description?`<div class="muted small">${esc(cur.description)}</div>`:''}</div>
    <button type="button" class="btn sm" onclick="renderPicker(true)">Change</button></div></div>`;return;
  }
  const acts=D.activities.filter(a=>a.active||a.id===pk.id).sort((a,b)=>a.name.localeCompare(b.name));
  if(!acts.length){box.innerHTML='<div class="picker muted">You have no active activities. Create one in the <b>Activities</b> tab first.</div>';return}
  box.innerHTML=`<div class="picker"><input type="search" placeholder="Search activities…" autocomplete="off" oninput="filterPicker(this.value)">
  <div class="picker-list" id="pkList">${acts.map(a=>`<button type="button" class="picker-item" data-q="${esc((a.name+' '+(a.description||'')).toLowerCase())}" onclick="pickAct('${a.id}')">
    <span><b>${esc(a.name)}</b>${a.description?`<br><span class="muted small">${esc(a.description)}</span>`:''}</span>
    <span class="badges">${a.minutes?`<span class="badge">${fmtMin(a.minutes)}</span>`:''}${badge('P',a.importance,'Priority')}</span></button>`).join('')}</div></div>`;
}
function filterPicker(q){q=q.trim().toLowerCase();document.querySelectorAll('#pkList .picker-item').forEach(b=>b.classList.toggle('hidden',!!q&&!b.dataset.q.includes(q)))}
function pickAct(id){pk.id=id;renderPicker(false);if(pk.onPick)pk.onPick(actById(id))}

/* ---------- plan task (new + edit) ---------- */
function openPlan(id,date,presetAct){
  const t=id?D.tasks.find(x=>x.id===id):null;if(id&&!t)return;
  const p=t?t.plan:{motives:[],outcomes:[]};
  pk={id:t?t.activityId:(presetAct||null),onPick:t?null:fillDefaults};
  openModal(`<h2>${t?'Planned task':'Add to plan'}</h2>`,t?fmtLong(t.date):'Name the task and pick the activity it belongs to',
  `${field('Task name <span class="req">*</span>',`<input type="text" id="tName" maxlength="80" placeholder="e.g. Finish chapter 3, Evening walk by the beach" value="${esc(t?t.name||'':'')}" oninput="this.classList.remove('invalid')">`)}
   ${field('Activity <span class="req">*</span>','<div id="pkBox"></div>')}
   <p class="hint">${t?'Changes here affect this task only — the activity itself won’t change.':'Pre-filled from the activity’s defaults. Change anything for this particular day.'}</p>
   <div class="grid2">${field('Date',`<input type="date" id="tDate" value="${t?t.date:date}">`)}${field('Planned time',dur('tMin',p.minutes))}</div>
   ${field('Why this, this time? <em>— motives</em>',chips('pMot',D.motives,p.motives))}
   ${field('What I hope to get from it <em>— outcomes</em>',chips('pOut',D.outcomes,p.outcomes))}
   ${field('Priority of this, today',scale('pImp','importance',p.importance))}
   <div class="grid2">${field('Planned mental effort',scale('pEff','effort',p.effort))}${field('Expected emotional resistance',scale('pRes','resistance',p.resistance))}</div>
   ${field('Notes',`<textarea id="tNote" rows="2" placeholder="Anything about the plan">${esc(p.note||'')}</textarea>`)}
   <div class="err" id="tErr"></div>`,
  `${t?`<button class="btn ghost danger" onclick="delTask('${id}')">Remove from plan</button>`:''}<span class="spacer"></span><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="savePlan(${t?`'${id}'`:'null'})">${t?'Save':'Add to plan'}</button>`);
  renderPicker(!pk.id);
  if(!t&&pk.id)fillDefaults(actById(pk.id));
  if(window.innerWidth>760)document.getElementById('tName').focus();
}
function fillDefaults(a){
  if(!a)return;
  setDur('tMin',a.minutes);setChips('pMot',a.motives);setChips('pOut',a.outcomes);
  setSeg('pImp',a.importance);setSeg('pEff',a.effort);setSeg('pRes',a.resistance);
}
function savePlan(id){
  const nameEl=document.getElementById('tName'),name=nameEl.value.trim(),err=document.getElementById('tErr');
  if(!name){nameEl.classList.add('invalid');err.textContent='Please give the task a name.';nameEl.focus();return}
  if(!pk.id){document.querySelector('#pkBox .picker').classList.add('invalid');err.textContent='Please choose an activity.';return}
  const mins=readDur('tMin');if(Number.isNaN(mins)){err.textContent='Planned time not understood — try 90, 1:30 or 1h 30m.';return}
  const plan={minutes:mins||0,motives:readChips('pMot'),outcomes:readChips('pOut'),importance:readSeg('pImp'),effort:readSeg('pEff'),resistance:readSeg('pRes'),note:document.getElementById('tNote').value.trim()};
  const date=document.getElementById('tDate').value||today();
  if(id){const t=D.tasks.find(x=>x.id===id);Object.assign(t,{name,date,activityId:pk.id,updated:nowISO()});Object.assign(t.plan,plan)}
  else D.tasks.push({id:uid(),name,date,activityId:pk.id,unplanned:false,created:nowISO(),plan,actual:{motives:[],outcomes:[]}});
  save();closeModal();render();toast(id?'Saved':'Added to plan');
}
function delTask(id){if(!confirm('Remove this task? The activity stays in your library.'))return;D.tasks=D.tasks.filter(x=>x.id!==id);save();closeModal();render();toast('Removed')}

/* ---------- REVIEW ---------- */
function vReview(m){
  const d=ui.reviewDate||(ui.reviewDate=today()),all=tasksOn(d),list=sortTasks(all,ui.reviewSort);
  const tt=totals(all),pend=all.filter(t=>!t.actual.status).length,post=all.filter(t=>t.actual.status==='postponed'&&!t.carried).length,unpl=all.filter(t=>t.unplanned);
  m.innerHTML=`<section class="page-head"><div><div class="eyebrow">End-of-day review · ${relLabel(d)}</div><h1>${fmtLong(d)}</h1><p class="lede">What actually happened? Tap a task to record it.</p></div>${dateNav('reviewDate',d)}</section>
  <div class="stats">${stat('Planned',fmtMin(tt.p))}${stat('Actually spent',tt.a?fmtMin(tt.a):'—')}${stat('Reviewed',`${all.length-pend}<span class="muted" style="font-size:1rem"> / ${all.length}</span>`)}${stat('Unplanned',unpl.length)}</div>
  <section class="card"><div class="card-head"><h2>Tasks</h2><div class="toolbar"><span class="muted small">Sort by</span>
    <select onchange="ui.reviewSort=this.value;render()">${[['status','Status, then priority'],['priority','Priority'],['activity','Activity'],['name','Task name']].map(([v,t])=>`<option value="${v}" ${ui.reviewSort===v?'selected':''}>${t}</option>`).join('')}</select>
    ${post?`<button class="btn sm" onclick="carryPostponed('${d}')">Move ${post} postponed to next day</button>`:''}</div></div>
    ${list.length?`<div class="tlist">${list.map(t=>taskRow(t,'openActual')).join('')}</div>`:emptyBox('Nothing was planned for this day.','Record anything you did — unplanned time counts too.')}</section>
  <div class="card soft row" style="justify-content:space-between"><div><b>Did something that wasn't planned?</b><div class="muted small">Spontaneous activities are part of real life, not failures.</div></div>
    <button class="btn" onclick="openUnplanned('${d}')">+ Add unplanned task</button></div>`;
}
function openUnplanned(date){
  pk={id:null,onPick:null};
  openModal('<h2>What did you do?</h2>',fmtLong(date),
   `${field('Task name <span class="req">*</span>','<input type="text" id="uName" maxlength="80" placeholder="What did you do?" oninput="this.classList.remove(\'invalid\')">')}
    ${field('Activity <span class="req">*</span>','<div id="pkBox"></div>')}<div class="err" id="uErr"></div>`,
   `<span class="spacer"></span><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="createUnplanned('${date}')">Next</button>`);
  renderPicker(true);
}
function createUnplanned(date){
