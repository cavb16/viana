  out.push(sec(12,'Priority vs completion',tbl(['Priority','Recorded','Completed','Completion rate'],[5,4,3,2,1].map(i=>{const l=R.filter(t=>+t.plan.importance===i);if(!l.length)return null;const c=l.filter(t=>DONE_KEYS.includes(t.actual.status)).length;return [esc(scaleTxt('importance',i)),l.length,c,pct(c/l.length)]}).filter(Boolean)),'Are high-priority tasks actually getting done?'));
  const dw=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],wk=dw.map(()=>({p:0,a:0,n:0}));T.forEach(t=>{const i=new Date(t.date+'T00:00:00').getDay();if(!t.unplanned)wk[i].p+=+t.plan.minutes||0;if(DONE_KEYS.includes(t.actual.status))wk[i].a+=+t.actual.minutes||0;wk[i].n++});const mx13=Math.max(1,...wk.map(w=>Math.max(w.p,w.a)));
  out.push(sec(13,'Day-of-week pattern',LEG+tbl(['Day','Tasks','Planned','Actual',''],[1,2,3,4,5,6,0].filter(i=>wk[i].n).map(i=>[dw[i],wk[i].n,fmtMin(wk[i].p),fmtMin(wk[i].a),twoBars(wk[i].p,wk[i].a,mx13)]))));
  const days=[...new Set(T.map(t=>t.date))].sort().slice(-31),dd=days.map(d=>[d,totals(T.filter(t=>t.date===d))]),mx14=Math.max(1,...dd.map(x=>Math.max(x[1].p,x[1].a)));
  out.push(sec(14,'Daily trend',LEG+tbl(['Date','Planned','Actual',''],dd.map(([d,x])=>[nice(d),fmtMin(x.p),fmtMin(x.a),twoBars(x.p,x.a,mx14)])),'Up to the last 31 days with tasks in this period.'));
  const g15=byAct(Done.filter(t=>!t.unplanned&&t.plan.outcomes.length));
  out.push(sec(15,'Expected outcomes achieved',tbl(['Activity','Tasks','Achieved'],Object.keys(g15).map(id=>{let e=0,h=0;g15[id].forEach(t=>{e+=t.plan.outcomes.length;h+=t.plan.outcomes.filter(o=>t.actual.outcomes.includes(o)).length});return [esc(actName(id)),g15[id].length,pct(e?h/e:null)]})),'Share of planned outcomes that were also recorded as actual outcomes.'));
  const g16=byAct(Done.filter(t=>!t.unplanned&&t.plan.motives.length&&t.actual.motives.length));
  out.push(sec(16,'Did the reason stay the same?',tbl(['Activity','Tasks','Same','Some overlap','Different'],Object.keys(g16).map(id=>{let s=0,o=0,d=0;g16[id].forEach(t=>{const P=t.plan.motives,A=t.actual.motives,ov=P.filter(x=>A.includes(x)).length;if(ov===P.length&&ov===A.length)s++;else if(ov)o++;else d++});return [esc(actName(id)),g16[id].length,s,o,d]})),'Compares planned motives with the motives recorded afterwards.'));
  const last={};D.tasks.filter(t=>DONE_KEYS.includes(t.actual.status)).forEach(t=>{if(!last[t.activityId]||t.date>last[t.activityId])last[t.activityId]=t.date});
  const nrows=D.activities.filter(a=>a.active).map(a=>{const l=last[a.id];return [a.name,l,l?Math.round((new Date(now)-new Date(l))/864e5):null]}).sort((x,y)=>(y[2]??1e9)-(x[2]??1e9));
  out.push(sec(17,'Activities you have not done lately',tbl(['Activity','Last done','Days ago'],nrows.map(x=>[esc(x[0]),x[1]?nice(x[1]):'Never',x[2]??'—'])),'Uses all your data, not just the selected period.'));
  const range=ui.anAll?'All time':ui.anFrom===ui.anTo?fmtLong(ui.anFrom):`${nice(ui.anFrom)} – ${nice(ui.anTo)}`;
  m.innerHTML=`<section class="page-head"><div><div class="eyebrow">Analysis</div><h1>How my time really went</h1><p class="lede">${range} · ${T.length} tasks · ${R.length} recorded</p></div></section>
  <section class="card"><div class="filters">${rangeFilters('anFrom','anTo',ui.anAll)}${presets('anFrom','anTo',true)}</div></section>
  ${R.length?'':'<div class="notice ok">Record actuals in <b>Review</b> for a few days and these sections will fill in.</div>'}${out.join('')}`;
}

/* ---------- ACTIVITIES ---------- */
function vActivities(m){
  const q=ui.libQ.trim().toLowerCase();
  const acts=D.activities.filter(a=>(ui.libStatus==='all'||(ui.libStatus==='active'?a.active:!a.active))&&(!q||a.name.toLowerCase().includes(q)||(a.description||'').toLowerCase().includes(q))).sort((a,b)=>a.name.localeCompare(b.name));
  m.innerHTML=`<section class="page-head"><div><div class="eyebrow">Library</div><h1>Activities</h1><p class="lede">The things I generally want to do. Your list is yours alone.</p></div>
    <div class="head-actions"><button class="btn primary" onclick="editAct()">+ New activity</button></div></section>
  <div class="row" style="margin-bottom:1rem"><input type="search" placeholder="Search…" value="${esc(ui.libQ)}" style="flex:2;min-width:180px" oninput="ui.libQ=this.value;clearTimeout(window._lq);window._lq=setTimeout(()=>{render();const s=document.querySelector('main input[type=search]');s.focus();s.setSelectionRange(s.value.length,s.value.length)},250)">
    <select style="flex:1;min-width:130px" onchange="ui.libStatus=this.value;render()">${[['active','Active'],['inactive','Inactive'],['all','All']].map(([v,t])=>`<option value="${v}" ${ui.libStatus===v?'selected':''}>${t}</option>`).join('')}</select></div>
  <div class="lib-grid">${acts.length?acts.map(a=>{const n=D.tasks.filter(t=>t.activityId===a.id);const dn=n.filter(t=>DONE_KEYS.includes(t.actual.status));
    return `<div class="acard ${a.active?'':'inactive'}" onclick="editAct('${a.id}')"><h3><span>${esc(a.name)}</span>${badge('P',a.importance,'Priority')}</h3>
    ${a.description?`<div class="desc">${esc(a.description)}</div>`:''}
    <div class="meta">Usual time <b>${fmtMin(a.minutes)}</b> · ${dn.length?`done ${dn.length}×`:'not done yet'}${a.active?'':' · <b>Inactive</b>'}</div>
    <div>${a.motives.slice(0,3).map(x=>`<span class="mini m">${esc(x)}</span>`).join('')}</div><div>${a.outcomes.slice(0,3).map(x=>`<span class="mini o">${esc(x)}</span>`).join('')}</div></div>`}).join(''):`<div class="card" style="grid-column:1/-1">${emptyBox('No activities match.','')}</div>`}</div>`;
}
function editAct(id){
  const a=id?actById(id):{name:'',description:'',minutes:60,importance:3,effort:3,resistance:3,motives:[],outcomes:[],active:true,history:[]};
  const hist=(a.history||[]).slice().reverse().slice(0,40);
  openModal(`<h2>${id?'Edit activity':'New activity'}</h2>`,'',
   `${field('Activity name <span class="req">*</span>',`<input type="text" id="acName" maxlength="60" value="${esc(a.name)}" placeholder="e.g. Learn Tamil">`)}
    ${field('What it means to me <em>optional</em>',`<textarea id="acDesc" rows="2">${esc(a.description||'')}</textarea>`)}
    <p class="hint">No justification needed — “Because I want to” is a perfectly good reason.</p>
    ${field('General motives <em>— why I might do this</em>',chips('acMot',D.motives,a.motives))}
    ${field('General outcomes <em>— what I usually get from it</em>',chips('acOut',D.outcomes,a.outcomes))}
    <div class="grid2">${field('Usual time',dur('acMin',a.minutes))}${field('General priority',scale('acImp','importance',a.importance))}</div>
    <div class="grid2">${field('Mental effort',scale('acEff','effort',a.effort))}${field('Emotional resistance',scale('acRes','resistance',a.resistance))}</div>
    ${id?`<label class="field" style="display:flex;gap:.5rem;align-items:center"><input type="checkbox" id="acActive" ${a.active?'checked':''} style="accent-color:var(--accent);width:16px;height:16px"> Active (inactive activities are hidden from planning but keep their history)</label>
    ${field('Change note <em>optional — why did this change?</em>','<input type="text" id="acWhy">')}`:''}
    ${hist.length?`<details><summary>Change history (${a.history.length})</summary><div class="table-wrap" style="margin-top:.5rem"><table class="simple"><tr><th>When</th><th>Field</th><th>Old</th><th>New</th><th>Note</th></tr>${hist.map(x=>`<tr><td>${new Date(x.at).toLocaleString()}</td><td>${esc(x.field)}</td><td>${esc(x.old)}</td><td>${esc(x.new)}</td><td>${esc(x.note||'')}</td></tr>`).join('')}</table></div></details>`:''}
    <div class="err" id="acErr"></div>`,
   `${id?`<button class="btn ghost danger" onclick="delAct('${id}')">Delete</button>`:''}<span class="spacer"></span><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveAct('${id||''}')">${id?'Save changes':'Create activity'}</button>`);
}
function saveAct(id){
  const err=document.getElementById('acErr'),mins=readDur('acMin');
  if(Number.isNaN(mins)){err.textContent='Time not understood — try 90, 1:30 or 1h 30m.';return}
  const v={name:document.getElementById('acName').value.trim(),description:document.getElementById('acDesc').value.trim(),minutes:mins||0,
    motives:readChips('acMot'),outcomes:readChips('acOut'),importance:readSeg('acImp'),effort:readSeg('acEff'),resistance:readSeg('acRes'),active:id?document.getElementById('acActive').checked:true};
  if(!v.name){document.getElementById('acName').classList.add('invalid');err.textContent='Please give the activity a name.';return}
  if(D.activities.some(a=>a.id!==id&&a.name.toLowerCase()===v.name.toLowerCase())){err.textContent='An activity with that name already exists.';return}
  if(id){const a=actById(id),why=document.getElementById('acWhy').value.trim();
    Object.keys(v).forEach(k=>{const o=Array.isArray(a[k])?a[k].join(', '):String(a[k]??''),n=Array.isArray(v[k])?v[k].join(', '):String(v[k]??'');if(o!==n)a.history.push({at:nowISO(),field:k,old:o,new:n,note:why})});
    Object.assign(a,v);
  }else D.activities.push(Object.assign({id:uid(),created:nowISO(),history:[]},v));
  save();closeModal();render();toast(id?'Saved — previous values kept in history':'Activity created');
}
function delAct(id){
  const n=D.tasks.filter(t=>t.activityId===id).length;
  if(!confirm(`Delete "${actName(id)}"${n?` and its ${n} task(s)`:''}? This only affects ${viewing?viewing.username+"'s":'your'} account and cannot be undone.`))return;
  D.activities=D.activities.filter(a=>a.id!==id);D.tasks=D.tasks.filter(t=>t.activityId!==id);save();closeModal();render();toast('Activity deleted');
}

/* ---------- SETTINGS ---------- */
function vSettings(m){
  m.innerHTML=`<section class="page-head"><div><div class="eyebrow">Settings</div><h1>Lists &amp; preferences</h1></div></section>
  <section class="card"><h2>Planning</h2><div class="row" style="justify-content:space-between;margin-top:.5rem"><div>Hours available per day<div class="muted small">Optional — shows unallocated time when planning</div></div>
    <input type="number" min="0" max="24" step="0.5" style="width:120px" value="${esc(D.settings.hoursPerDay||'')}" onchange="D.settings.hoursPerDay=this.value;save();toast('Saved')"></div></section>
  <section class="card"><h2>Motives <span class="muted small">(${D.motives.length})</span></h2><p class="muted small">Why I might do something.</p>${listEditor('motives')}</section>
  <section class="card"><h2>Outcomes <span class="muted small">(${D.outcomes.length})</span></h2><p class="muted small">What I might get from something.</p>${listEditor('outcomes')}</section>
  <section class="card"><h2>Rating meanings</h2><div class="table-wrap" style="margin-top:.5rem"><table class="simple"><tr><th></th>${[1,2,3,4,5].map(n=>`<th>${n}</th>`).join('')}</tr>
    ${Object.values(SCALES).map(s=>`<tr><td><b>${s.label}</b></td>${s.d.map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</table></div></section>
  <section class="card"><h2>Your data</h2><div class="head-actions" style="margin-top:.6rem"><button class="btn primary" onclick="exportJSON()">Download backup (.json)</button>
    <label class="btn" style="cursor:pointer">Restore from backup…<input type="file" accept=".json" class="hidden" onchange="importJSON(this)"></label><button class="btn" onclick="exportCSV()">Export tasks (.csv)</button></div>
    <p class="muted small" style="margin-top:.8rem">${D.activities.length} activities · ${D.tasks.length} tasks</p></section>
  ${viewing?'':`<section class="card"><h2>Change password</h2>${S.isAdmin?'<p class="muted small">The admin password is fixed.</p>':`
    <div class="grid2" style="margin-top:.6rem">${field('Current password','<input type="password" id="cpOld">')}${field('New password','<input type="password" id="cpNew">')}</div>
    <button class="btn" onclick="changePw()">Update password</button>`}</section>`}
  <p class="muted small" style="text-align:center">Storage: <b>${Store.mode==='cloud'?'☁ Cloud (Firebase) — same login on any device':'📱 This browser only (local mode)'}</b> · Viana version ${VERSION}</p>`;
}
function listEditor(k){
  const defs=k==='motives'?DEF_MOTIVES:DEF_OUTCOMES,miss=defs.filter(x=>!D[k].includes(x)).length;
  return D[k].map((x,i)=>`<div class="mrow"><span>${esc(x)}</span><button class="icon-btn" onclick="renameItem('${k}',${i})" title="Rename">✎</button><button class="icon-btn" onclick="removeItem('${k}',${i})" title="Remove">✕</button></div>`).join('')+
  `<div class="row" style="margin-top:.7rem"><input type="text" id="new_${k}" placeholder="Add a new ${k==='motives'?'motive':'outcome'}…" style="flex:1;min-width:180px" onkeydown="if(event.key==='Enter')addItem('${k}')"><button class="btn" onclick="addItem('${k}')">Add</button>
   ${miss?`<button class="btn ghost" onclick="restoreDefaults('${k}')">Add back ${miss} default${miss>1?'s':''}</button>`:''}</div>`;
}
function restoreDefaults(k){(k==='motives'?DEF_MOTIVES:DEF_OUTCOMES).forEach(x=>{if(!D[k].includes(x))D[k].push(x)});save();render();toast('Defaults added')}
function addItem(k){const v=document.getElementById('new_'+k).value.trim();if(!v)return;if(D[k].includes(v)){toast('Already in the list');return}D[k].push(v);save();render();toast('Added')}
function renameItem(k,i){const o=D[k][i],n=(prompt('Rename',o)||'').trim();if(!n||n===o)return;if(D[k].includes(n)){toast('Already in the list');return}D[k][i]=n;
  D.activities.forEach(a=>a[k]=a[k].map(x=>x===o?n:x));D.tasks.forEach(t=>{t.plan[k]=t.plan[k].map(x=>x===o?n:x);t.actual[k]=t.actual[k].map(x=>x===o?n:x)});save();render();toast('Renamed')}
function removeItem(k,i){if(!confirm(`Remove "${D[k][i]}" from the list? Past tasks keep it.`))return;D[k].splice(i,1);save();render()}
async function changePw(){const o=document.getElementById('cpOld').value,n=document.getElementById('cpNew').value;if(n.length<4){toast('New password must be at least 4 characters');return}
  try{await Store.changePassword(S.id,o,n);toast('Password updated');render()}catch(e){toast(e.message)}}
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function exportCSV(){
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const h=['Date','Task','Activity','Unplanned','Planned min','Planned motives','Planned outcomes','Priority','Planned effort','Planned resistance','Plan note','Status','Actual min','Actual motives','Actual outcomes','Actual effort','Actual resistance','Satisfaction','Actual note'];
  const rows=D.tasks.slice().sort((a,b)=>a.date<b.date?-1:1).map(t=>[t.date,taskName(t),actName(t.activityId),t.unplanned?'Yes':'',t.plan.minutes,t.plan.motives.join('; '),t.plan.outcomes.join('; '),t.plan.importance,t.plan.effort,t.plan.resistance,t.plan.note,stLabel(t),t.actual.minutes,t.actual.motives.join('; '),t.actual.outcomes.join('; '),t.actual.effort,t.actual.resistance,t.actual.satisfaction,t.actual.note]);
  download(`viana-tasks-${(viewing||S).username}-${today()}.csv`,'\ufeff'+[h,...rows].map(r=>r.map(q).join(',')).join('\n'),'text/csv');
}
function exportJSON(){download(`viana-backup-${(viewing||S).username}-${today()}.json`,JSON.stringify(D,null,1),'application/json');toast('Backup downloaded')}
function importJSON(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.activities||!d.tasks)throw 0;
  if(!confirm('Replace all data in this account with the backup?'))return;D=normalise(d);save();render();toast('Backup restored')}catch(e){toast('That file is not a Viana backup')}};r.readAsText(f);inp.value=''}

/* ---------- ADMIN ---------- */
async function vAdmin(m){
  if(!S.isAdmin){go('today');return}
  const head=`<section class="page-head"><div><div class="eyebrow">Admin</div><h1>Users</h1></div><button class="btn" onclick="vAdmin(document.getElementById('main'))">↻ Refresh list</button></section>
  ${Store.mode==='cloud'?'<div class="notice ok">☁ Connected to Firebase. Accounts created on any device appear here.</div>':
  `<div class="notice warn"><b>This device is in local mode.</b> Only accounts created in this browser on this device are listed — accounts created on another device are stored on that device.
   To see everyone in one list, put your Firebase details in <code>firebase-config.js</code> on GitHub, then open the GitHub Pages link on every device.</div>`}`;
  m.innerHTML=head+'<section class="card muted">Loading users…</section>';
  let users=[];
  try{users=await Store.listUsers()}catch(e){if(tab==='admin')m.innerHTML=head+`<section class="card"><div class="err">Could not load users: ${esc(Store.friendly?Store.friendly(e):e.message)}</div></section>`;return}
  if(tab!=='admin')return;
  ui.adminUsers=users.sort((a,b)=>a.username.localeCompare(b.username));
  m.innerHTML=head+`<section class="card"><h2>All users (${users.length})</h2><p class="muted small">Open a user's data to view, edit or delete anything in it. Changes save to their account.</p>
  ${users.length?`<div class="table-wrap"><table class="simple"><tr><th>Username</th><th>Created</th>${Store.mode==='cloud'?'<th>Last saved</th>':''}<th>Tasks</th><th>Status</th><th></th></tr>
  ${ui.adminUsers.map((u,i)=>`<tr><td><b>${esc(u.username)}</b></td><td>${u.created?new Date(u.created).toLocaleDateString():''}</td>${Store.mode==='cloud'?`<td>${u.updated?new Date(u.updated).toLocaleString():'—'}</td>`:''}<td>${u.tasks}</td>
  <td>${u.disabled?'<span class="pill bad">Disabled</span>':'<span class="pill good">Active</span>'}</td>
  <td><div class="row" style="gap:.3rem;flex-wrap:nowrap"><button class="btn sm primary" onclick="adminAct('open',${i})">Open data</button>
  ${Store.canResetPasswords?`<button class="btn sm" onclick="adminAct('reset',${i})">Reset password</button>`:''}
  <button class="btn sm" onclick="adminAct('toggle',${i})">${u.disabled?'Enable':'Disable'}</button>
  <button class="btn sm danger" onclick="adminAct('delete',${i})">Delete</button></div></td></tr>`).join('')}</table></div>`:'<p class="muted">No users found yet.</p>'}</section>
  ${Store.mode==='cloud'?'<p class="muted small">Deleting a user removes their data. To remove their login completely or reset a password, use Firebase console → Authentication → Users.</p>':''}`;
}
async function adminAct(what,i){
  const u=ui.adminUsers[i];if(!u)return;
  try{
    if(what==='open'){await flushSave();viewing={id:u.id,username:u.username};normalisedChanged=false;D=await Store.load(u.id);if(normalisedChanged)save();tab='today';render();toast('Now viewing '+u.username);return}
    if(what==='reset'){const p=prompt(`New password for ${u.username} (min 4 characters):`);if(!p)return;if(p.length<4){toast('Too short');return}await Store.resetPassword(u.id,p);toast('Password reset for '+u.username)}
    if(what==='toggle'){await Store.setDisabled(u.id,!u.disabled);toast(u.disabled?'User enabled':'User disabled')}
    if(what==='delete'){if(!confirm(`Delete user "${u.username}" and ALL their data? This cannot be undone.`))return;await Store.deleteUser(u.id);toast('User deleted')}
  }catch(e){toast(Store.friendly?Store.friendly(e):e.message)}
  render();
}
async function stopViewing(){await flushSave();viewing=null;normalisedChanged=false;D=await Store.load(S.id);tab='admin';render()}

/* =====================================================================
   START
   ===================================================================== */
(async function start(){
  const pill=document.getElementById('modePill');
  const cfg=await findConfig();
  if(cfg){
    try{
      const b='https://www.gstatic.com/firebasejs/10.12.2/';
      await loadScript(b+'firebase-app-compat.js');await loadScript(b+'firebase-auth-compat.js');await loadScript(b+'firebase-firestore-compat.js');
      Store=CloudStore;
      const s=await Store.init(cfg);
      pill.textContent='☁ Synced with Firebase — sign in from any device';
      if(s){S=s;await enterApp()}
      return;
    }catch(e){
      console.error(e);Store=LocalStore;
      pill.innerHTML='<span style="color:var(--danger)">Could not connect to Firebase ('+esc(e.message||e)+'). Using this device only.</span>';
    }
  }else pill.textContent='📱 Local mode — accounts and data stay on this device';
  const s=await LocalStore.init();if(s){S=s;await enterApp()}
})();
</script>
