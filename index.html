<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Viana — Activity & Time Planning</title>
<meta name="viana-version" content="2.0-login">
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#1d2433;--muted:#6b7385;--line:#e3e6ee;--pri:#4f46e5;--pri2:#eef0ff;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--r:12px}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
button,input,select,textarea{font:inherit}
.hidden{display:none!important}
/* auth */
#auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.authbox{background:var(--card);width:100%;max-width:380px;border-radius:16px;padding:28px;box-shadow:0 10px 30px rgba(30,40,80,.08)}
.logo{font-size:30px;font-weight:800;color:var(--pri);text-align:center;letter-spacing:.5px}
.sub{text-align:center;color:var(--muted);margin:4px 0 20px;font-size:13px}
.tabs2{display:flex;background:var(--bg);border-radius:10px;padding:4px;margin-bottom:18px}
.tabs2 button{flex:1;border:0;background:none;padding:9px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:600}
.tabs2 button.on{background:#fff;color:var(--pri);box-shadow:0 1px 3px rgba(0,0,0,.08)}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px;font-weight:600}
input[type=text],input[type=password],input[type=number],input[type=date],select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
textarea{min-height:64px;resize:vertical}
.btn{border:0;background:var(--pri);color:#fff;padding:10px 16px;border-radius:10px;cursor:pointer;font-weight:600}
.btn.full{width:100%;margin-top:16px}
.btn.ghost{background:var(--pri2);color:var(--pri)}
.btn.light{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:#fee2e2;color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:13px}
.err{color:var(--bad);font-size:13px;min-height:18px;margin-top:10px}
.modepill{font-size:12px;text-align:center;color:var(--muted);margin-top:14px}
/* app */
header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:10px;padding:10px 16px;max-width:1100px;margin:0 auto}
.hrow .logo{font-size:22px;text-align:left}
.who{margin-left:auto;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px}
.badge{background:var(--pri2);color:var(--pri);padding:3px 8px;border-radius:20px;font-size:12px;font-weight:700}
nav{display:flex;gap:4px;overflow-x:auto;padding:0 12px 8px;max-width:1100px;margin:0 auto;scrollbar-width:none}
nav button{border:0;background:none;padding:8px 12px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:600;white-space:nowrap}
nav button.on{background:var(--pri2);color:var(--pri)}
.viewas{background:#fff7ed;color:#9a3412;padding:8px 16px;font-size:13px;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
main{max-width:1100px;margin:0 auto;padding:16px}
h2{margin:4px 0 14px;font-size:20px}
h3{margin:0 0 10px;font-size:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.muted{color:var(--muted);font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.task{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff;margin-bottom:8px;cursor:pointer}
.task:hover{border-color:var(--pri)}
.task .nm{font-weight:600}
.chip{display:inline-block;padding:4px 10px;border-radius:20px;border:1px solid var(--line);font-size:12px;margin:2px;background:#fff;cursor:pointer;user-select:none}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.st{font-size:12px;padding:3px 8px;border-radius:20px;font-weight:600;white-space:nowrap}
.st0{background:#f1f5f9;color:#64748b}.st1{background:#dcfce7;color:#166534}.st2{background:#e0f2fe;color:#075985}.st3{background:#fef9c3;color:#854d0e}.st4{background:#ffedd5;color:#9a3412}.st5{background:#fee2e2;color:#991b1b}.st6{background:#f3e8ff;color:#6b21a8}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 11px;cursor:pointer;font-size:13px}
.seg button.on{background:var(--pri);border-color:var(--pri);color:#fff}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;background:#fafbfd}
.bar{height:8px;border-radius:4px;background:var(--pri);min-width:2px}
.bar.b2{background:#f59e0b}
.bars{display:flex;flex-direction:column;gap:3px;min-width:120px}
.sumgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:12px}
.stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px}
.stat b{display:block;font-size:20px}
.cmp{display:grid;grid-template-columns:110px 1fr 1fr;border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:13px}
.cmp div{padding:7px 10px;border-bottom:1px solid var(--line)}
.cmp .h{background:#fafbfd;font-weight:700;color:var(--muted)}
.cmp .k{color:var(--muted);font-weight:600;background:#fafbfd}
.diff{background:#fffbeb}
.legend{font-size:12px;color:var(--muted);display:flex;gap:12px;margin-bottom:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:middle}
/* modal */
#modal{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
#modal.hidden{display:none}
.mbox{background:#fff;width:100%;max-width:620px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px}
@media(min-width:700px){#modal{align-items:center}.mbox{border-radius:16px}}
.mfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;position:sticky;bottom:-18px;background:#fff;padding:10px 0}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1d2433;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:60;opacity:0;transition:.25s;pointer-events:none}
#toast.show{opacity:1}
.empty{text-align:center;color:var(--muted);padding:24px}
@media(max-width:600px){.grid2{grid-template-columns:1fr}.cmp{grid-template-columns:90px 1fr 1fr}main{padding:12px}}
</style>
<!-- Firebase settings (optional). If this file is missing or empty, Viana runs in local mode. -->
<script src="firebase-config.js" onerror="window.VIANA_FIREBASE_CONFIG=null"></script>

<body>

<!-- ============ LOGIN PAGE ============ -->
<section id="auth">
  <div class="authbox">

    <div class="sub">Personal Activity &amp; Time Planning</div>
    <div class="tabs2">
      <button id="tabIn" class="on" onclick="authTab('in')">Sign in</button>
      <button id="tabUp" onclick="authTab('up')">Create account</button>
    </div>

      <div class="err" id="authErr"></div>

  </div>
</section>

<!-- ============ APP ============ -->
<section id="app" class="hidden">
  <header>
    <div class="hrow">
      <div class="logo">Viana</div>
      <div class="who"><span id="whoName"></span><span id="whoBadge" class="badge hidden">ADMIN</span>
        <button class="btn light sm" onclick="signOut()">Sign out</button></div>
    </div>
    <div id="viewAs" class="viewas hidden"></div>
    <nav id="nav"></nav>
  </header>
  <main id="main"></main>
</section>

<div id="modal" class="hidden" onclick="if(event.target===this)closeModal()"><div class="mbox" id="mbox"></div></div>
<div id="toast"></div>

<script>
'use strict';
/* =====================================================================
   CONSTANTS & DEFAULTS
   ===================================================================== */
const ADMIN_USER='ADMIN', ADMIN_PASS='2409';
const STATUSES=[
  {k:'',        t:'Not recorded',          c:'st0'},
  {k:'asplanned',t:'Completed as planned', c:'st1'},
  {k:'differently',t:'Completed differently',c:'st2'},
  {k:'partial', t:'Partially done',        c:'st3'},
  {k:'postponed',t:'Postponed',            c:'st4'},
  {k:'skipped', t:'Skipped',               c:'st5'},
  {k:'cancelled',t:'Cancelled',            c:'st6'}
];
const DONE_KEYS=['asplanned','differently','partial'];
const DEF_MOTIVES=['Because I want to','Relaxation','Learning','Health','Connection','Duty / obligation','Personal growth','Fun','Sense of achievement','Habit'];
const DEF_OUTCOMES=['Felt rested','Gained knowledge','Improved a skill','Felt fitter','Closer relationships','Got it done','Enjoyment','Clarity of mind','Nothing in particular'];
const DEF_ACTS=[
 ['Watch movies','Leisure',120,2,1,1,['Relaxation','Fun'],['Enjoyment','Felt rested']],
 ['Read books','Learning',45,4,3,2,['Learning','Because I want to'],['Gained knowledge']],
 ['Exercise','Health',45,5,3,4,['Health'],['Felt fitter']],
 ['Travel','Leisure',240,3,2,2,['Fun','Because I want to'],['Enjoyment']],
 ['Learn programming','Learning',60,4,4,3,['Learning','Personal growth'],['Improved a skill']],
 ['Learn mathematics','Learning',60,4,5,4,['Learning','Personal growth'],['Improved a skill']],
 ['Journaling','Reflection',15,3,2,2,['Personal growth'],['Clarity of mind']],
 ['Spend time with family','Relationships',90,5,1,1,['Connection'],['Closer relationships']],
 ['Meet friends','Relationships',120,3,1,1,['Connection','Fun'],['Closer relationships','Enjoyment']],
 ['Meditation','Health',20,4,2,3,['Health','Relaxation'],['Clarity of mind']],
 ['Cooking','Home',60,3,2,2,['Duty / obligation','Fun'],['Got it done']],
 ['Household chores','Home',45,3,2,3,['Duty / obligation'],['Got it done']],
 ['Music','Leisure',30,2,1,1,['Relaxation','Because I want to'],['Enjoyment']],
 ['Walk','Health',30,3,1,2,['Health','Relaxation'],['Felt fitter','Felt rested']],
 ['Office work outside hours','Work',60,3,4,4,['Duty / obligation'],['Got it done']]
];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const nowISO=()=>new Date().toISOString();
const dstr=d=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*60000);return z.toISOString().slice(0,10)};
const today=()=>dstr(new Date());
const addDays=(s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return dstr(d)};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtMin=m=>{m=Math.round(+m||0);const h=Math.floor(Math.abs(m)/60),r=Math.abs(m)%60;return (m<0?'-':'')+(h?h+'h ':'')+(r||!h?r+'m':'')};
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
const f1=v=>v==null?'—':(Math.round(v*10)/10).toString();
const pct=v=>v==null?'—':Math.round(v*100)+'%';
const stInfo=k=>STATUSES.find(s=>s.k===(k||''))||STATUSES[0];

function defaultData(){
  return {version:2,created:nowISO(),
    activities:DEF_ACTS.map(a=>({id:uid(),name:a[0],category:a[1],minutes:a[2],importance:a[3],effort:a[4],resistance:a[5],motives:a[6],outcomes:a[7],notes:'',active:true,created:nowISO(),history:[]})),
    tasks:[],motives:DEF_MOTIVES.slice(),outcomes:DEF_OUTCOMES.slice(),settings:{hoursPerDay:''}};
}
function normalise(d){
  d=d&&typeof d==='object'?d:defaultData();
  d.activities=d.activities||[];d.tasks=d.tasks||[];d.motives=d.motives||DEF_MOTIVES.slice();d.outcomes=d.outcomes||DEF_OUTCOMES.slice();d.settings=d.settings||{};
  d.activities.forEach(a=>{a.history=a.history||[];a.motives=a.motives||[];a.outcomes=a.outcomes||[];if(a.active===undefined)a.active=true});
  d.tasks.forEach(t=>{t.plan=t.plan||{};t.actual=t.actual||{};t.plan.motives=t.plan.motives||[];t.plan.outcomes=t.plan.outcomes||[];t.actual.motives=t.actual.motives||[];t.actual.outcomes=t.actual.outcomes||[]});
  return d;
}

/* =====================================================================
   PASSWORD HASHING (local mode)
   ===================================================================== */
async function hashPw(salt,pw){
  const s=salt+'|'+pw;
  if(window.crypto&&crypto.subtle){
    const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));
    return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');
  }
  let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return 'f'+(h>>>0).toString(16);
}

/* =====================================================================
   STORAGE: LOCAL (this browser only)
   ===================================================================== */
const LocalStore={
  mode:'local',
  K_USERS:'viana2_users', K_SESS:'viana2_session',
  users(){try{return JSON.parse(localStorage.getItem(this.K_USERS))||{}}catch(e){return {}}},
  putUsers(u){localStorage.setItem(this.K_USERS,JSON.stringify(u))},
  async init(){const s=sessionStorage.getItem(this.K_SESS);return s?JSON.parse(s):null},
  remember(s){sessionStorage.setItem(this.K_SESS,JSON.stringify(s))},
  async signUp(username,pw){
    const key=username.toLowerCase();
    if(key===ADMIN_USER.toLowerCase())throw new Error('That username is reserved.');
    const u=this.users(); if(u[key])throw new Error('That username is already taken.');
    const salt=uid(); u[key]={username,salt,hash:await hashPw(salt,pw),created:nowISO(),disabled:false};
    this.putUsers(u); localStorage.setItem('viana2_data_'+key,JSON.stringify(defaultData()));
    const s={id:key,username,isAdmin:false}; this.remember(s); return s;
  },
  async signIn(username,pw){
    if(username.toUpperCase()===ADMIN_USER){
      if(pw!==ADMIN_PASS)throw new Error('Incorrect username or password.');
      const s={id:'__admin__',username:ADMIN_USER,isAdmin:true};this.remember(s);return s;
    }
    const key=username.toLowerCase(),r=this.users()[key];
    if(!r||r.hash!==await hashPw(r.salt,pw))throw new Error('Incorrect username or password.');
    if(r.disabled)throw new Error('This account has been disabled by the admin.');
    const s={id:key,username:r.username,isAdmin:false};this.remember(s);return s;
  },
  async signOut(){sessionStorage.removeItem(this.K_SESS)},
  async load(id){try{return normalise(JSON.parse(localStorage.getItem('viana2_data_'+id)))}catch(e){return normalise(null)}},
  async save(id,data){localStorage.setItem('viana2_data_'+id,JSON.stringify(data))},
  async listUsers(){
    const u=this.users();
    return Object.keys(u).map(k=>{let n=0;try{n=(JSON.parse(localStorage.getItem('viana2_data_'+k))||{}).tasks.length}catch(e){}
      return {id:k,username:u[k].username,created:u[k].created,disabled:!!u[k].disabled,tasks:n}});
  },
  async setDisabled(id,v){const u=this.users();if(u[id]){u[id].disabled=v;this.putUsers(u)}},
  async deleteUser(id){const u=this.users();delete u[id];this.putUsers(u);localStorage.removeItem('viana2_data_'+id)},
  async resetPassword(id,pw){const u=this.users();if(!u[id])return;u[id].salt=uid();u[id].hash=await hashPw(u[id].salt,pw);this.putUsers(u)},
  async changePassword(id,oldpw,newpw){
    const u=this.users(),r=u[id];if(!r)throw new Error('Admin password is fixed and cannot be changed here.');
    if(r.hash!==await hashPw(r.salt,oldpw))throw new Error('Current password is incorrect.');
    r.salt=uid();r.hash=await hashPw(r.salt,newpw);this.putUsers(u);
  },
  canResetPasswords:true
};

/* =====================================================================
   STORAGE: CLOUD (Firebase Auth + Firestore) — used when firebase-config.js is filled in
   ===================================================================== */
const EMAIL_DOMAIN='@viana.app';
const cloudPw=p=>p+'#viana';   // Firebase needs 6+ characters; this lets short passwords like 2409 work
const CloudStore={
  mode:'cloud',canResetPasswords:false,
  async init(){
    const cfg=window.VIANA_FIREBASE_CONFIG;
    firebase.initializeApp(cfg);
    this.auth=firebase.auth();this.db=firebase.firestore();
    await this.auth.setPersistence(firebase.auth.Auth.Persistence.SESSION);
    const user=await new Promise(r=>{const un=this.auth.onAuthStateChanged(u=>{un();r(u)})});
    if(!user)return null;
    return this.sessionFor(user);
  },
  async sessionFor(user){
    const isAdmin=user.email===ADMIN_USER.toLowerCase()+EMAIL_DOMAIN;
    const ref=this.db.collection('users').doc(user.uid);
    let snap=await ref.get();
    if(!snap.exists){
      const uname=isAdmin?ADMIN_USER:(user.displayName||user.email.replace(EMAIL_DOMAIN,''));
      await ref.set({username:uname,created:nowISO(),disabled:false,isAdmin,data:JSON.stringify(defaultData())});
      snap=await ref.get();
    }
    const d=snap.data();
    if(d.disabled&&!isAdmin){await this.auth.signOut();throw new Error('This account has been disabled by the admin.')}
    return {id:user.uid,username:d.username,isAdmin};
  },
  friendly(e){
    const c=e&&e.code||'';
    if(/invalid-credential|wrong-password|user-not-found|invalid-login/.test(c))return 'Incorrect username or password.';
    if(/email-already-in-use/.test(c))return 'That username is already taken.';
    if(/network/.test(c))return 'No internet connection. Please try again.';
    if(/operation-not-allowed/.test(c))return 'Email/Password sign-in is not enabled in Firebase (Authentication → Sign-in method).';
    if(/permission-denied/.test(c))return 'Firestore rules are blocking access. Paste firestore.rules into Firebase and publish.';
    return e.message||String(e);
  },
  async signUp(username,pw){
    if(username.toUpperCase()===ADMIN_USER)throw new Error('That username is reserved.');
    if(!/^[A-Za-z0-9._-]+$/.test(username))throw new Error('Use only letters, numbers, dot, dash or underscore in the username.');
    try{
      const cr=await this.auth.createUserWithEmailAndPassword(username.toLowerCase()+EMAIL_DOMAIN,cloudPw(pw));
      await cr.user.updateProfile({displayName:username});
      await this.db.collection('users').doc(cr.user.uid).set({username,created:nowISO(),disabled:false,isAdmin:false,data:JSON.stringify(defaultData())});
      return {id:cr.user.uid,username,isAdmin:false};
    }catch(e){throw new Error(this.friendly(e))}
  },
  async signIn(username,pw){
    const isAdmin=username.toUpperCase()===ADMIN_USER;
    if(isAdmin&&pw!==ADMIN_PASS)throw new Error('Incorrect username or password.');
    const email=username.toLowerCase()+EMAIL_DOMAIN;
    try{
      const cr=await this.auth.signInWithEmailAndPassword(email,cloudPw(pw));
      return await this.sessionFor(cr.user);
    }catch(e){
      if(isAdmin&&!/disabled/.test(e.message||'')){ // first ever admin sign-in creates the admin login
        try{const cr=await this.auth.createUserWithEmailAndPassword(email,cloudPw(pw));return await this.sessionFor(cr.user)}
        catch(e2){throw new Error(this.friendly(e2.code&&/email-already-in-use/.test(e2.code)?e:e2))}
      }
      if(e instanceof Error&&!e.code)throw e;
      throw new Error(this.friendly(e));
    }
  },
  async signOut(){await this.auth.signOut()},
  async load(id){const s=await this.db.collection('users').doc(id).get();if(!s.exists)return normalise(null);let d=null;try{d=JSON.parse(s.data().data)}catch(e){}return normalise(d)},
  async save(id,data){await this.db.collection('users').doc(id).set({data:JSON.stringify(data),updated:nowISO()},{merge:true})},
  async listUsers(){
    const q=await this.db.collection('users').get();const out=[];
    q.forEach(doc=>{const d=doc.data();if(d.isAdmin)return;let n=0;try{n=JSON.parse(d.data).tasks.length}catch(e){}
      out.push({id:doc.id,username:d.username,created:d.created,disabled:!!d.disabled,tasks:n})});
    return out;
  },
  async setDisabled(id,v){await this.db.collection('users').doc(id).set({disabled:v},{merge:true})},
  async deleteUser(id){await this.db.collection('users').doc(id).delete()},
  async resetPassword(){throw new Error('In cloud mode, reset passwords from the Firebase console (Authentication → Users).')},
  async changePassword(id,oldpw,newpw){
    const u=this.auth.currentUser;
    try{const cred=firebase.auth.EmailAuthProvider.credential(u.email,cloudPw(oldpw));await u.reauthenticateWithCredential(cred);await u.updatePassword(cloudPw(newpw))}
    catch(e){throw new Error(this.friendly(e))}
  }
};

let Store=LocalStore;
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('Could not load '+src));document.head.appendChild(s)})}

/* =====================================================================
   APP STATE
   ===================================================================== */
let S=null;          // session {id, username, isAdmin}
let D=null;          // data currently on screen
let viewing=null;    // {id, username} when admin views another user's data
let tab='today';
let saveTimer=null;
const ui={planDate:null,reviewDate:null,cmpFrom:null,cmpTo:null,anRange:30,adminUsers:null};

function dataOwner(){return viewing?viewing.id:S.id}
function save(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{try{await Store.save(dataOwner(),D)}catch(e){toast('Save failed: '+(e.message||e))}},250);
}
async function flushSave(){if(saveTimer){clearTimeout(saveTimer);saveTimer=null;await Store.save(dataOwner(),D)}}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2200)}

/* =====================================================================
   AUTH UI
   ===================================================================== */
let authMode='in';
function authTab(m){
  authMode=m;
  document.getElementById('tabIn').classList.toggle('on',m==='in');
  document.getElementById('tabUp').classList.toggle('on',m==='up');
  document.getElementById('aPass2Wrap').classList.toggle('hidden',m!=='up');
  document.getElementById('authBtn').textContent=m==='in'?'Sign in':'Create account';
  document.getElementById('aPass').autocomplete=m==='in'?'current-password':'new-password';
  document.getElementById('authErr').textContent='';
}
async function doAuth(ev){
  ev.preventDefault();
  const u=document.getElementById('aUser').value.trim(),p=document.getElementById('aPass').value,err=document.getElementById('authErr'),btn=document.getElementById('authBtn');
  err.textContent='';
  if(!u||!p){err.textContent='Enter username and password.';return false}
  if(authMode==='up'){
    if(u.length<3){err.textContent='Username must be at least 3 characters.';return false}
    if(p.length<4){err.textContent='Password must be at least 4 characters.';return false}
    if(p!==document.getElementById('aPass2').value){err.textContent='Passwords do not match.';return false}
  }
  btn.disabled=true;btn.textContent='Please wait…';
  try{
    S=authMode==='in'?await Store.signIn(u,p):await Store.signUp(u,p);
    document.getElementById('authForm').reset();
    await enterApp();
    if(authMode==='up')toast('Account created. Welcome, '+S.username+'!');
  }catch(e){err.textContent=e.message||String(e)}
  btn.disabled=false;btn.textContent=authMode==='in'?'Sign in':'Create account';
  return false;
}
async function enterApp(){
  viewing=null;D=await Store.load(S.id);tab='today';
  document.getElementById('auth').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('whoName').textContent=S.username;
  document.getElementById('whoBadge').classList.toggle('hidden',!S.isAdmin);
  render();
}
async function signOut(){
  try{await flushSave()}catch(e){}
  await Store.signOut();S=null;D=null;viewing=null;
  document.getElementById('app').classList.add('hidden');
  document.getElementById('auth').classList.remove('hidden');
  authTab('in');
}

/* =====================================================================
   RENDER
   ===================================================================== */
const TABS=[['today','Today'],['plan','Plan'],['review','Review'],['compare','Compare'],['analysis','Analysis'],['activities','Activities'],['settings','Settings']];
function render(){
  const tabs=TABS.slice();if(S.isAdmin)tabs.push(['admin','Admin']);
  document.getElementById('nav').innerHTML=tabs.map(([k,t])=>`<button class="${tab===k?'on':''}" onclick="go('${k}')">${t}</button>`).join('');
  const va=document.getElementById('viewAs');
  if(viewing){va.classList.remove('hidden');va.innerHTML=`Admin: you are viewing and editing <b>${esc(viewing.username)}</b>'s data <button class="btn sm light" onclick="stopViewing()">Back to my data</button>`}
  else va.classList.add('hidden');
  const m=document.getElementById('main');
  ({today:vToday,plan:vPlan,review:vReview,compare:vCompare,analysis:vAnalysis,activities:vActivities,settings:vSettings,admin:vAdmin}[tab]||vToday)(m);
}
function go(t){tab=t;render();window.scrollTo(0,0)}
const actById=id=>D.activities.find(a=>a.id===id);
const actName=id=>(actById(id)||{}).name||'(deleted activity)';
const tasksOn=d=>D.tasks.filter(t=>t.date===d);

function taskRow(t,click){
  const s=stInfo(t.actual.status);
  const act=t.actual.status&&t.actual.minutes!=null&&t.actual.minutes!==''?` · actual ${fmtMin(t.actual.minutes)}`:'';
  return `<div class="task" onclick="${click}('${t.id}')"><div style="flex:1"><div class="nm">${esc(actName(t.activityId))}${t.unplanned?' <span class="st st6">Unplanned</span>':''}</div>
  <div class="muted">${t.unplanned?'':'planned '+fmtMin(t.plan.minutes)}${act}${t.plan.note?' · '+esc(t.plan.note):''}</div></div><span class="st ${s.c}">${s.t}</span></div>`;
}
function totals(list){let p=0,a=0;list.forEach(t=>{if(!t.unplanned)p+=+t.plan.minutes||0;if(DONE_KEYS.includes(t.actual.status))a+=+t.actual.minutes||0});return {p,a}}

/* ---------- TODAY ---------- */
function vToday(m){
  const d=today(),list=tasksOn(d),tt=totals(list),done=list.filter(t=>DONE_KEYS.includes(t.actual.status)).length;
  m.innerHTML=`<h2>Today <span class="muted">${new Date().toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'})}</span></h2>
  <div class="sumgrid"><div class="stat"><span class="muted">Planned</span><b>${fmtMin(tt.p)}</b></div><div class="stat"><span class="muted">Actual so far</span><b>${fmtMin(tt.a)}</b></div>
  <div class="stat"><span class="muted">Tasks done</span><b>${done} / ${list.length}</b></div></div>
  <div class="row" style="margin-bottom:10px"><b>Today's tasks</b><span class="spacer"></span><button class="btn sm ghost" onclick="ui.planDate=today();go('plan')">+ Plan a task</button><button class="btn sm" onclick="ui.reviewDate=today();go('review')">Record actuals</button></div>
  ${list.length?list.map(t=>taskRow(t,'openActual')).join(''):'<div class="card empty">Nothing planned for today. Use <b>Plan</b> to add tasks.</div>'}`;
}

/* ---------- PLAN ---------- */
function vPlan(m){
  const d=ui.planDate||(ui.planDate=addDays(today(),1)),list=tasksOn(d).filter(t=>!t.unplanned),tt=totals(list);
  const hrs=+D.settings.hoursPerDay||0;

  <span class="muted">Planned <b>${fmtMin(tt.p)}</b>${hrs?` of ${hrs}h available (${fmtMin(hrs*60-tt.p)} free)`:''}</span></div>

function chips(name,all,sel){return `<div data-chips="${name}">`+all.map(x=>`<span class="chip ${sel.includes(x)?'on':''}" data-v="${esc(x)}" onclick="this.classList.toggle('on')">${esc(x)}</span>`).join('')+`</div>`}
function readChips(name){return [...document.querySelectorAll(`[data-chips="${name}"] .chip.on`)].map(c=>c.dataset.v)}
function scale(name,val,lbl){return `<label>${lbl}</label><div class="seg" data-seg="${name}">`+[1,2,3,4,5].map(n=>`<button type="button" class="${+val===n?'on':''}" onclick="segPick(this)">${n}</button>`).join('')+`</div>`}
function segPick(b){const on=b.classList.contains('on');b.parentNode.querySelectorAll('button').forEach(x=>x.classList.remove('on'));if(!on)b.classList.add('on')}
function readSeg(name){const b=document.querySelector(`[data-seg="${name}"] button.on`);return b?+b.textContent:null}
function openModal(h){document.getElementById('mbox').innerHTML=h;document.getElementById('modal').classList.remove('hidden')}
function closeModal(){document.getElementById('modal').classList.add('hidden')}

function newTask(date){
  const acts=D.activities.filter(a=>a.active);
  if(!acts.length){toast('Create an activity first.');return}
  openModal(`<h3>Add task for ${date}</h3><label>Activity</label>
  <select id="ntAct">${acts.map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join('')}</select>
  <div class="mfoot"><button class="btn light" onclick="closeModal()">Cancel</button><button class="btn" onclick="createTask('${date}')">Next</button></div>`);
}
function createTask(date,unplanned){
  const a=actById(document.getElementById('ntAct').value);
  const t={id:uid(),date,activityId:a.id,unplanned:!!unplanned,created:nowISO(),
    plan:unplanned?{motives:[],outcomes:[]}:{minutes:a.minutes,motives:a.motives.slice(),outcomes:a.outcomes.slice(),importance:a.importance,effort:a.effort,resistance:a.resistance,note:''},
    actual:{motives:[],outcomes:[]}};
  D.tasks.push(t);save();closeModal();render();
  unplanned?openActual(t.id):editPlan(t.id);
}
function editPlan(id){
  const t=D.tasks.find(x=>x.id===id);if(!t)return;const p=t.plan;
  openModal(`<h3>Plan: ${esc(actName(t.activityId))}</h3><div class="muted">${t.date} · values copied from the activity; changing them here affects this task only.</div>
  <div class="grid2"><div><label>Date</label><input type="date" id="pDate" value="${t.date}"></div><div><label>Planned time (minutes)</label><input type="number" id="pMin" min="0" value="${p.minutes??''}"></div></div>
  <label>Why I'm doing it (motives)</label>${chips('pMot',D.motives,p.motives)}
  <label>What I expect to get (outcomes)</label>${chips('pOut',D.outcomes,p.outcomes)}
  ${scale('pImp',p.importance,'Importance (1 low – 5 high)')}${scale('pEff',p.effort,'Expected mental effort')}${scale('pRes',p.resistance,'Expected emotional resistance')}
  <label>Note</label><textarea id="pNote">${esc(p.note||'')}</textarea>
  <div class="mfoot"><button class="btn danger" onclick="delTask('${id}')">Delete</button><span class="spacer"></span><button class="btn light" onclick="closeModal()">Cancel</button><button class="btn" onclick="savePlan('${id}')">Save</button></div>`);
}
function savePlan(id){
  const t=D.tasks.find(x=>x.id===id);
  t.date=document.getElementById('pDate').value||t.date;
  Object.assign(t.plan,{minutes:+document.getElementById('pMin').value||0,motives:readChips('pMot'),outcomes:readChips('pOut'),importance:readSeg('pImp'),effort:readSeg('pEff'),resistance:readSeg('pRes'),note:document.getElementById('pNote').value.trim()});
  t.updated=nowISO();save();closeModal();render();toast('Plan saved');
}
function delTask(id){if(!confirm('Delete this task?'))return;D.tasks=D.tasks.filter(x=>x.id!==id);save();closeModal();render();toast('Task deleted')}

function newUnplanned(date){
  openModal(`<h3>Unplanned task on ${date}</h3><label>Activity</label>
  <select id="ntAct">${D.activities.filter(a=>a.active).map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join('')}</select>
  <div class="mfoot"><button class="btn light" onclick="closeModal()">Cancel</button><button class="btn" onclick="createTask('${date}',true)">Next</button></div>`);
}
function openActual(id){
  const t=D.tasks.find(x=>x.id===id);if(!t)return;const a=t.actual;
  openModal(`<h3>${esc(actName(t.activityId))}</h3><div class="muted">${t.date} — record what actually happened</div>
  <label>Status</label><div class="seg" id="aSt">${STATUSES.slice(1).filter(s=>!(t.unplanned&&s.k!=='asplanned'&&s.k!=='partial'&&s.k!=='differently')).map(s=>`<button type="button" data-k="${s.k}" class="${a.status===s.k?'on':''}" onclick="pickStatus(this,'${id}')">${t.unplanned&&s.k==='asplanned'?'Done':s.t}</button>`).join('')}</div>
  <div id="aBody">
  <label>Actual time (minutes)</label><input type="number" id="aMin" min="0" value="${a.minutes??''}">
  <label>Why I actually did it (motives)</label>${chips('aMot',D.motives,a.motives)}
  <label>What I actually got (outcomes)</label>${chips('aOut',D.outcomes,a.outcomes)}
  ${scale('aEff',a.effort,'Actual mental effort')}${scale('aRes',a.resistance,'Actual emotional resistance')}${scale('aSat',a.satisfaction,'Satisfaction')}
  </div><label>Note</label><textarea id="aNote">${esc(a.note||'')}</textarea>
  <div class="mfoot">${a.status?`<button class="btn light" onclick="clearActual('${id}')">Clear</button>`:''}<span class="spacer"></span><button class="btn light" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveActual('${id}')">Save</button></div>`);
}
function pickStatus(b,id){
  document.querySelectorAll('#aSt button').forEach(x=>x.classList.remove('on'));b.classList.add('on');
  const t=D.tasks.find(x=>x.id===id),k=b.dataset.k;
  if(k==='asplanned'&&!t.unplanned){ // copy plan into actual fields
    document.getElementById('aMin').value=t.plan.minutes??'';
    document.querySelectorAll('[data-chips="aMot"] .chip').forEach(c=>c.classList.toggle('on',t.plan.motives.includes(c.dataset.v)));
    document.querySelectorAll('[data-chips="aOut"] .chip').forEach(c=>c.classList.toggle('on',t.plan.outcomes.includes(c.dataset.v)));
    [['aEff','effort'],['aRes','resistance']].forEach(([s,f])=>document.querySelectorAll(`[data-seg="${s}"] button`).forEach(x=>x.classList.toggle('on',+x.textContent===t.plan[f])));
  }
  if(['postponed','skipped','cancelled'].includes(k))document.getElementById('aMin').value=0;
}
function saveActual(id){
  const t=D.tasks.find(x=>x.id===id),b=document.querySelector('#aSt button.on');
  if(!b){toast('Choose a status first');return}
  t.actual={status:b.dataset.k,minutes:document.getElementById('aMin').value===''?null:+document.getElementById('aMin').value,motives:readChips('aMot'),outcomes:readChips('aOut'),
    effort:readSeg('aEff'),resistance:readSeg('aRes'),satisfaction:readSeg('aSat'),note:document.getElementById('aNote').value.trim(),recorded:nowISO()};
  save();closeModal();render();toast('Actuals saved');
}
function clearActual(id){const t=D.tasks.find(x=>x.id===id);t.actual={motives:[],outcomes:[]};save();closeModal();render()}
function carryPostponed(d){
  const nd=addDays(d,1);let n=0;
  D.tasks.filter(t=>t.date===d&&t.actual.status==='postponed'&&!t.carried).forEach(t=>{
    D.tasks.push({id:uid(),date:nd,activityId:t.activityId,unplanned:false,created:nowISO(),carriedFrom:t.id,plan:JSON.parse(JSON.stringify(t.plan)),actual:{motives:[],outcomes:[]}});t.carried=true;n++});
  save();render();toast(n+' task(s) moved to '+nd);
}

/* ---------- COMPARE (side by side) ---------- */
function vCompare(m){
  ui.cmpTo=ui.cmpTo||today();ui.cmpFrom=ui.cmpFrom||addDays(ui.cmpTo,-6);
  const list=D.tasks.filter(t=>t.date>=ui.cmpFrom&&t.date<=ui.cmpTo).sort((a,b)=>a.date<b.date?1:-1);
  const L=v=>v&&v.length?v.map(esc).join(', '):'—',N=v=>v==null||v===''?'—':v;
  const row=(k,p,a)=>`<div class="k">${k}</div><div>${p}</div><div class="${p!==a&&a!=='—'?'diff':''}">${a}</div>`;
  m.innerHTML=`<h2>Planned vs actual</h2>
  <div class="card row"><span class="muted">From</span><input type="date" value="${ui.cmpFrom}" style="max-width:170px" onchange="ui.cmpFrom=this.value;render()">
  <span class="muted">to</span><input type="date" value="${ui.cmpTo}" style="max-width:170px" onchange="ui.cmpTo=this.value;render()"><span class="spacer"></span><span class="muted">Highlighted = differs from plan</span></div>
  ${list.length?list.map(t=>{const p=t.plan,a=t.actual,s=stInfo(a.status);
    return `<div class="card"><div class="row" style="margin-bottom:8px"><b>${esc(actName(t.activityId))}</b><span class="muted">${t.date}</span><span class="spacer"></span><span class="st ${s.c}">${s.t}</span></div>
    <div class="cmp"><div class="h"></div><div class="h">Planned</div><div class="h">Actual</div>
    ${row('Time',t.unplanned?'(unplanned)':fmtMin(p.minutes),a.minutes==null?'—':fmtMin(a.minutes))}
    ${row('Motives',L(p.motives),L(a.motives))}${row('Outcomes',L(p.outcomes),L(a.outcomes))}
    ${row('Mental effort',N(p.effort),N(a.effort))}${row('Resistance',N(p.resistance),N(a.resistance))}
    ${row('Importance / satisfaction',N(p.importance),N(a.satisfaction))}${row('Note',esc(p.note||'—'),esc(a.note||'—'))}</div></div>`}).join(''):'<div class="card empty">No tasks in this period.</div>'}`;
}

/* ---------- ANALYSIS (17 sections) ---------- */
function vAnalysis(m){
  const r=ui.anRange,to=today(),from=r?addDays(to,-(r-1)):'0000';
  const T=D.tasks.filter(t=>t.date>=from&&t.date<=to),R=T.filter(t=>t.actual.status),Done=R.filter(t=>DONE_KEYS.includes(t.actual.status));
  const sec=(n,title,body,note)=>`<div class="card"><h3>${n}. ${title}</h3>${note?`<div class="muted" style="margin-bottom:8px">${note}</div>`:''}${body}</div>`;
  const tbl=(head,rows)=>rows.length?`<div style="overflow-x:auto"><table><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</table></div>`:'<div class="muted">Not enough data yet.</div>';
  const twoBars=(a,b,max)=>`<div class="bars"><div class="bar" style="width:${max?Math.round(a/max*100):0}%"></div><div class="bar b2" style="width:${max?Math.round(b/max*100):0}%"></div></div>`;
  const leg='<div class="legend"><span><i style="background:var(--pri)"></i>Planned</span><span><i style="background:#f59e0b"></i>Actual</span></div>';
  const byAct=f=>{const g={};f.forEach(t=>{(g[t.activityId]=g[t.activityId]||[]).push(t)});return g};
  const out=[];

  // 1 time
  const tt=totals(T);const g1=byAct(T);const r1=Object.keys(g1).map(id=>{const x=totals(g1[id]);return [id,x.p,x.a]}).sort((a,b)=>b[1]+b[2]-a[1]-a[2]);const mx1=Math.max(1,...r1.map(x=>Math.max(x[1],x[2])));
  out.push(sec(1,'Planned vs actual time',`<div class="sumgrid"><div class="stat"><span class="muted">Planned</span><b>${fmtMin(tt.p)}</b></div><div class="stat"><span class="muted">Actual (done tasks)</span><b>${fmtMin(tt.a)}</b></div><div class="stat"><span class="muted">Difference</span><b>${fmtMin(tt.a-tt.p)}</b></div></div>${leg}`+
    tbl(['Activity','Planned','Actual','Diff',''],r1.map(x=>[esc(actName(x[0])),fmtMin(x[1]),fmtMin(x[2]),fmtMin(x[2]-x[1]),twoBars(x[1],x[2],mx1)]))));
  // 2 motives, 3 outcomes
  const cnt=(list,f)=>{const c={};list.forEach(t=>f(t).forEach(v=>c[v]=(c[v]||0)+1));return c};
  [[2,'Planned vs actual motives','motives'],[3,'Planned vs actual outcomes','outcomes']].forEach(([n,ti,k])=>{
    const p=cnt(R.filter(t=>!t.unplanned),t=>t.plan[k]),a=cnt(Done,t=>t.actual[k]);const keys=[...new Set([...Object.keys(p),...Object.keys(a)])].sort((x,y)=>(p[y]||0)+(a[y]||0)-(p[x]||0)-(a[x]||0));const mx=Math.max(1,...keys.map(x=>Math.max(p[x]||0,a[x]||0)));
    out.push(sec(n,ti,leg+tbl([k==='motives'?'Motive':'Outcome','Planned (times)','Actual (times)',''],keys.map(x=>[esc(x),p[x]||0,a[x]||0,twoBars(p[x]||0,a[x]||0,mx)])),'Counts how often each was chosen in recorded tasks.'));
  });
  // 4 effort 5 resistance
  [[4,'Planned vs actual mental effort','effort'],[5,'Planned vs actual emotional resistance','resistance']].forEach(([n,ti,k])=>{
    const g=byAct(Done.filter(t=>t.plan[k]&&t.actual[k]));const rows=Object.keys(g).map(id=>{const p=avg(g[id].map(t=>t.plan[k])),a=avg(g[id].map(t=>t.actual[k]));return [esc(actName(id)),f1(p),f1(a),(a-p>0?'+':'')+f1(a-p),a>p?'Harder than expected':a<p?'Easier than expected':'As expected']});
    out.push(sec(n,ti,tbl(['Activity','Avg planned','Avg actual','Diff','Reading'],rows),'Scale 1–5, done tasks where both values were entered.'));
  });
  // 6 status
  const sc={};R.forEach(t=>sc[t.actual.status]=(sc[t.actual.status]||0)+1);
  out.push(sec(6,'How tasks ended',tbl(['Status','Tasks','Share'],STATUSES.slice(1).filter(s=>sc[s.k]).map(s=>[`<span class="st ${s.c}">${s.t}</span>`,sc[s.k],pct(sc[s.k]/R.length)]))+`<div class="muted" style="margin-top:6px">${T.length-R.length} task(s) in this period have no actuals recorded.</div>`));
  // 7 postpone/skip by activity
  const g7=byAct(R);out.push(sec(7,'Postponed / skipped by activity',tbl(['Activity','Recorded','Postponed','Skipped/cancelled','Rate'],Object.keys(g7).map(id=>{const l=g7[id],po=l.filter(t=>t.actual.status==='postponed').length,sk=l.filter(t=>['skipped','cancelled'].includes(t.actual.status)).length;return [esc(actName(id)),l.length,po,sk,pct((po+sk)/l.length),(po+sk)/l.length]}).sort((a,b)=>b[5]-a[5]).map(x=>x.slice(0,5)))));
  // 8 estimation accuracy
  const g8=byAct(Done.filter(t=>!t.unplanned&&+t.plan.minutes>0&&t.actual.minutes!=null));
  out.push(sec(8,'Time estimate accuracy',tbl(['Activity','Tasks','Actual ÷ planned','Reading'],Object.keys(g8).map(id=>{const ra=avg(g8[id].map(t=>t.actual.minutes/t.plan.minutes));return [esc(actName(id)),g8[id].length,f1(ra)+'×',ra>1.15?'Takes longer than planned':ra<0.85?'Takes less than planned':'Well estimated']})),'1.0× means actual time matched the plan.'));
  // 9 time share
  const g9=byAct(Done);const tot9=Done.reduce((s,t)=>s+(+t.actual.minutes||0),0);
  out.push(sec(9,'Where actual time went',tbl(['Activity','Actual time','Share',''],Object.keys(g9).map(id=>{const m=g9[id].reduce((s,t)=>s+(+t.actual.minutes||0),0);return [id,m]}).sort((a,b)=>b[1]-a[1]).map(([id,m])=>[esc(actName(id)),fmtMin(m),pct(tot9?m/tot9:0),`<div class="bar" style="width:${tot9?Math.round(m/tot9*100):0}%"></div>`]))));
  // 10 planned vs unplanned
  const up=Done.filter(t=>t.unplanned),pl=Done.filter(t=>!t.unplanned),um=up.reduce((s,t)=>s+(+t.actual.minutes||0),0),pm=pl.reduce((s,t)=>s+(+t.actual.minutes||0),0);
  out.push(sec(10,'Planned vs unplanned activity',`<div class="sumgrid"><div class="stat"><span class="muted">From planned tasks</span><b>${fmtMin(pm)}</b>${pl.length} tasks</div><div class="stat"><span class="muted">Unplanned</span><b>${fmtMin(um)}</b>${up.length} tasks</div><div class="stat"><span class="muted">Unplanned share</span><b>${pct(pm+um?um/(pm+um):null)}</b></div></div>`));
  // 11 satisfaction
  const g11=byAct(Done.filter(t=>t.actual.satisfaction));
  out.push(sec(11,'Satisfaction relative to time',tbl(['Activity','Avg satisfaction','Hours','Satisfaction per hour'],Object.keys(g11).map(id=>{const l=g11[id],s=avg(l.map(t=>t.actual.satisfaction)),h=l.reduce((x,t)=>x+(+t.actual.minutes||0),0)/60;return [esc(actName(id)),f1(s),f1(h),h?f1(l.reduce((x,t)=>x+t.actual.satisfaction,0)/h):'—']}))));
  // 12 importance vs completion
  out.push(sec(12,'Importance vs completion',tbl(['Importance','Recorded','Completed','Completion rate'],[5,4,3,2,1].map(i=>{const l=R.filter(t=>+t.plan.importance===i);return l.length?[i,l.length,l.filter(t=>DONE_KEYS.includes(t.actual.status)).length,pct(l.filter(t=>DONE_KEYS.includes(t.actual.status)).length/l.length)]:null}).filter(Boolean)),'Are important tasks actually getting done?'));
  // 13 day of week
  const dw=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],wk=dw.map(()=>({p:0,a:0,n:0}));T.forEach(t=>{const i=new Date(t.date+'T00:00:00').getDay();if(!t.unplanned)wk[i].p+=+t.plan.minutes||0;if(DONE_KEYS.includes(t.actual.status))wk[i].a+=+t.actual.minutes||0;wk[i].n++});const mx13=Math.max(1,...wk.map(w=>Math.max(w.p,w.a)));
  out.push(sec(13,'Day-of-week pattern',leg+tbl(['Day','Tasks','Planned','Actual',''],[1,2,3,4,5,6,0].filter(i=>wk[i].n).map(i=>[dw[i],wk[i].n,fmtMin(wk[i].p),fmtMin(wk[i].a),twoBars(wk[i].p,wk[i].a,mx13)]))));
  // 14 daily trend
  const days=[...new Set(T.map(t=>t.date))].sort().slice(-31);const dd=days.map(d=>[d,totals(T.filter(t=>t.date===d))]);const mx14=Math.max(1,...dd.map(x=>Math.max(x[1].p,x[1].a)));
  out.push(sec(14,'Daily trend',leg+tbl(['Date','Planned','Actual',''],dd.map(([d,x])=>[d,fmtMin(x.p),fmtMin(x.a),twoBars(x.p,x.a,mx14)])),'Up to the last 31 days with tasks in this period.'));
  // 15 outcome fulfilment
  const of=Done.filter(t=>!t.unplanned&&t.plan.outcomes.length);const g15=byAct(of);
  out.push(sec(15,'Expected outcomes achieved',tbl(['Activity','Tasks','Expected outcomes achieved'],Object.keys(g15).map(id=>{let e=0,h=0;g15[id].forEach(t=>{e+=t.plan.outcomes.length;h+=t.plan.outcomes.filter(o=>t.actual.outcomes.includes(o)).length});return [esc(actName(id)),g15[id].length,pct(e?h/e:null)]})),'Share of planned outcomes that were also recorded as actual outcomes.'));
  // 16 motive match
  const mm=Done.filter(t=>!t.unplanned&&t.plan.motives.length&&t.actual.motives.length);const g16=byAct(mm);
  out.push(sec(16,'Did the reason stay the same?',tbl(['Activity','Tasks','Same motives','Some overlap','Different'],Object.keys(g16).map(id=>{let s=0,o=0,d=0;g16[id].forEach(t=>{const P=t.plan.motives,A=t.actual.motives,ov=P.filter(x=>A.includes(x)).length;if(ov===P.length&&ov===A.length)s++;else if(ov)o++;else d++});return [esc(actName(id)),g16[id].length,s,o,d]})),'Compares planned motives with the motives recorded afterwards.'));
  // 17 neglected
  const last={};D.tasks.filter(t=>DONE_KEYS.includes(t.actual.status)).forEach(t=>{if(!last[t.activityId]||t.date>last[t.activityId])last[t.activityId]=t.date});
  const nrows=D.activities.filter(a=>a.active).map(a=>{const l=last[a.id];const days=l?Math.round((new Date(to)-new Date(l))/864e5):null;return [a.name,l,days]}).sort((x,y)=>(y[2]??1e9)-(x[2]??1e9));
  out.push(sec(17,'Activities you have not done lately',tbl(['Activity','Last done','Days ago'],nrows.map(x=>[esc(x[0]),x[1]||'Never',x[2]??'—'])),'Uses all your data, not just the selected period.'));

  m.innerHTML=`<h2>Analysis</h2><div class="card row"><span class="muted">Period</span><div class="seg">${[[7,'7 days'],[30,'30 days'],[90,'90 days'],[0,'All time']].map(([v,t])=>`<button class="${ui.anRange===v?'on':''}" onclick="ui.anRange=${v};render()">${t}</button>`).join('')}</div>
  <span class="spacer"></span><span class="muted">${T.length} tasks · ${R.length} with actuals</span></div>
  ${R.length?'':'<div class="card muted">Record actuals in <b>Review</b> for a few days and these sections will fill in.</div>'}${out.join('')}`;
}

/* ---------- ACTIVITIES ---------- */
function vActivities(m){
  const acts=D.activities.slice().sort((a,b)=>(b.active-a.active)||a.name.localeCompare(b.name));
  m.innerHTML=`<h2>Activities</h2><div class="row" style="margin-bottom:10px"><span class="muted">Your own list — changes here don't affect other users.</span><span class="spacer"></span><button class="btn sm" onclick="editAct()">+ New activity</button></div>
  ${acts.length?acts.map(a=>`<div class="task" onclick="editAct('${a.id}')"><div style="flex:1"><div class="nm">${esc(a.name)} ${a.active?'':'<span class="st st0">Inactive</span>'}</div>
  <div class="muted">${esc(a.category||'')} · default ${fmtMin(a.minutes)} · importance ${a.importance??'—'} · ${D.tasks.filter(t=>t.activityId===a.id).length} tasks</div></div></div>`).join(''):'<div class="card empty">No activities. Add one to get started.</div>'}`;
}
function editAct(id){
  const a=id?actById(id):{name:'',category:'',minutes:30,importance:3,effort:3,resistance:3,motives:[],outcomes:[],notes:'',active:true,history:[]};
  const hist=(a.history||[]).slice().reverse().slice(0,30);
  openModal(`<h3>${id?'Edit activity':'New activity'}</h3>
  <div class="grid2"><div><label>Name</label><input type="text" id="acName" value="${esc(a.name)}"></div><div><label>Category</label><input type="text" id="acCat" value="${esc(a.category||'')}"></div></div>
  <label>Default time (minutes)</label><input type="number" id="acMin" min="0" value="${a.minutes??''}">
  <label>Default motives</label>${chips('acMot',D.motives,a.motives)}<label>Default outcomes</label>${chips('acOut',D.outcomes,a.outcomes)}
  ${scale('acImp',a.importance,'Default importance')}${scale('acEff',a.effort,'Default mental effort')}${scale('acRes',a.resistance,'Default emotional resistance')}
  <label>Notes</label><textarea id="acNotes">${esc(a.notes||'')}</textarea>
  <label><input type="checkbox" id="acActive" ${a.active?'checked':''}> Active (shows when planning)</label>
  ${id?`<label>Reason for change (optional, saved in history)</label><input type="text" id="acWhy">`:''}
  ${hist.length?`<details style="margin-top:12px"><summary class="muted">Change history (${a.history.length})</summary>${tbl2(hist)}</details>`:''}
  <div class="mfoot">${id?`<button class="btn danger" onclick="delAct('${id}')">Delete</button>`:''}<span class="spacer"></span><button class="btn light" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveAct('${id||''}')">Save</button></div>`);
}
function tbl2(h){return `<table><tr><th>When</th><th>Field</th><th>Old</th><th>New</th><th>Note</th></tr>${h.map(x=>`<tr><td>${new Date(x.at).toLocaleString()}</td><td>${esc(x.field)}</td><td>${esc(x.old)}</td><td>${esc(x.new)}</td><td>${esc(x.note||'')}</td></tr>`).join('')}</table>`}
function saveAct(id){
  const v={name:document.getElementById('acName').value.trim(),category:document.getElementById('acCat').value.trim(),minutes:+document.getElementById('acMin').value||0,
    motives:readChips('acMot'),outcomes:readChips('acOut'),importance:readSeg('acImp'),effort:readSeg('acEff'),resistance:readSeg('acRes'),notes:document.getElementById('acNotes').value.trim(),active:document.getElementById('acActive').checked};
  if(!v.name){toast('Enter a name');return}
  if(D.activities.some(a=>a.id!==id&&a.name.toLowerCase()===v.name.toLowerCase())){toast('An activity with that name already exists');return}
  if(id){const a=actById(id),why=document.getElementById('acWhy').value.trim();
    Object.keys(v).forEach(k=>{const o=Array.isArray(a[k])?a[k].join(', '):String(a[k]??''),n=Array.isArray(v[k])?v[k].join(', '):String(v[k]??'');if(o!==n)a.history.push({at:nowISO(),field:k,old:o,new:n,note:why})});
    Object.assign(a,v);
  }else D.activities.push(Object.assign({id:uid(),created:nowISO(),history:[]},v));
  save();closeModal();render();toast('Activity saved');
}
function delAct(id){
  const n=D.tasks.filter(t=>t.activityId===id).length;
  if(!confirm(`Delete "${actName(id)}"${n?` and its ${n} task(s)`:''}? This only affects ${viewing?esc(viewing.username)+"'s":'your'} account and cannot be undone.`))return;
  D.activities=D.activities.filter(a=>a.id!==id);D.tasks=D.tasks.filter(t=>t.activityId!==id);save();closeModal();render();toast('Activity deleted');
}

/* ---------- SETTINGS ---------- */
function vSettings(m){
  m.innerHTML=`<h2>Settings</h2>
  <div class="card"><h3>Planning</h3><label>Hours available per day (optional)</label><input type="number" min="0" max="24" style="max-width:160px" value="${D.settings.hoursPerDay||''}" onchange="D.settings.hoursPerDay=this.value;save();toast('Saved')"></div>
  <div class="card"><h3>Motives</h3>${listEditor('motives')}</div>
  <div class="card"><h3>Outcomes</h3>${listEditor('outcomes')}</div>
  <div class="card"><h3>My data</h3><div class="row"><button class="btn sm light" onclick="exportCSV()">Export tasks (CSV)</button><button class="btn sm light" onclick="exportJSON()">Download backup</button>
  <label class="btn sm light" style="margin:0;color:var(--ink)">Restore backup<input type="file" accept=".json" class="hidden" onchange="importJSON(this)"></label></div></div>
  ${viewing?'':`<div class="card"><h3>Change password</h3>${S.isAdmin?'<div class="muted">The admin password is fixed (2409).</div>':`
  <div class="grid2"><div><label>Current password</label><input type="password" id="cpOld"></div><div><label>New password</label><input type="password" id="cpNew"></div></div>
  <button class="btn sm" style="margin-top:10px" onclick="changePw()">Update password</button>`}</div>`}
  <div class="card muted">Storage: <b>${Store.mode==='cloud'?'Cloud (Firebase) — same login works on any device':'This browser only (local mode)'}</b> · Viana 2.0</div>`;
}
function listEditor(k){
  return D[k].map((x,i)=>`<span class="chip">${esc(x)} <a href="#" onclick="renameItem('${k}',${i});return false" title="Rename">✎</a> <a href="#" onclick="removeItem('${k}',${i});return false" title="Remove" style="color:var(--bad)">✕</a></span>`).join('')+
  `<div class="row" style="margin-top:8px"><input type="text" id="new_${k}" placeholder="Add new…" style="max-width:240px"><button class="btn sm" onclick="addItem('${k}')">Add</button></div>`;
}
function addItem(k){const v=document.getElementById('new_'+k).value.trim();if(!v)return;if(D[k].includes(v)){toast('Already in the list');return}D[k].push(v);save();render()}
function renameItem(k,i){const o=D[k][i],n=(prompt('Rename',o)||'').trim();if(!n||n===o)return;D[k][i]=n;
  const f=k;D.activities.forEach(a=>a[f]=a[f].map(x=>x===o?n:x));D.tasks.forEach(t=>{t.plan[f]=t.plan[f].map(x=>x===o?n:x);t.actual[f]=t.actual[f].map(x=>x===o?n:x)});save();render()}
function removeItem(k,i){if(!confirm(`Remove "${D[k][i]}" from the list? Past tasks keep it.`))return;D[k].splice(i,1);save();render()}
async function changePw(){const o=document.getElementById('cpOld').value,n=document.getElementById('cpNew').value;if(n.length<4){toast('New password must be at least 4 characters');return}
  try{await Store.changePassword(S.id,o,n);toast('Password updated');render()}catch(e){toast(e.message)}}
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function exportCSV(){
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const h=['Date','Activity','Unplanned','Planned min','Planned motives','Planned outcomes','Importance','Planned effort','Planned resistance','Plan note','Status','Actual min','Actual motives','Actual outcomes','Actual effort','Actual resistance','Satisfaction','Actual note'];
  const rows=D.tasks.slice().sort((a,b)=>a.date<b.date?-1:1).map(t=>[t.date,actName(t.activityId),t.unplanned?'Yes':'',t.plan.minutes,t.plan.motives.join('; '),t.plan.outcomes.join('; '),t.plan.importance,t.plan.effort,t.plan.resistance,t.plan.note,stInfo(t.actual.status).t,t.actual.minutes,t.actual.motives.join('; '),t.actual.outcomes.join('; '),t.actual.effort,t.actual.resistance,t.actual.satisfaction,t.actual.note]);
  download(`viana-tasks-${(viewing||S).username}-${today()}.csv`,[h,...rows].map(r=>r.map(q).join(',')).join('\n'),'text/csv');
}
function exportJSON(){download(`viana-backup-${(viewing||S).username}-${today()}.json`,JSON.stringify(D,null,1),'application/json')}
function importJSON(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.activities||!d.tasks)throw 0;
  if(!confirm('Replace all data in this account with the backup?'))return;D=normalise(d);save();render();toast('Backup restored')}catch(e){toast('That file is not a Viana backup')}};r.readAsText(f)}

/* ---------- ADMIN ---------- */
async function vAdmin(m){
  if(!S.isAdmin){go('today');return}
  m.innerHTML='<h2>Admin</h2><div class="card muted">Loading users…</div>';
  let users=[];try{users=await Store.listUsers()}catch(e){m.innerHTML=`<h2>Admin</h2><div class="card err">${esc(Store.friendly?Store.friendly(e):e.message)}</div>`;return}
  if(tab!=='admin')return;
  m.innerHTML=`<h2>Admin</h2>
  <div class="card"><h3>Users (${users.length})</h3><div class="muted" style="margin-bottom:8px">Open a user's data to view, edit or delete any activity, task or entry. Everything you change is saved to their account.</div>
  ${users.length?`<div style="overflow-x:auto"><table><tr><th>Username</th><th>Created</th><th>Tasks</th><th>Status</th><th></th></tr>
  ${users.sort((a,b)=>a.username.localeCompare(b.username)).map(u=>`<tr><td><b>${esc(u.username)}</b></td><td>${u.created?new Date(u.created).toLocaleDateString():''}</td><td>${u.tasks}</td><td>${u.disabled?'<span class="st st5">Disabled</span>':'<span class="st st1">Active</span>'}</td>
  <td><div class="row"><button class="btn sm" onclick="viewUser('${u.id}','${esc(u.username)}')">Open data</button>
  ${Store.canResetPasswords?`<button class="btn sm light" onclick="adminReset('${u.id}','${esc(u.username)}')">Reset password</button>`:''}
  <button class="btn sm light" onclick="adminDisable('${u.id}',${!u.disabled})">${u.disabled?'Enable':'Disable'}</button>
  <button class="btn sm danger" onclick="adminDelete('${u.id}','${esc(u.username)}')">Delete</button></div></td></tr>`).join('')}</table></div>`:'<div class="muted">No users have created accounts yet.</div>'}</div>
  ${Store.mode==='cloud'?'<div class="card muted">Cloud mode: deleting a user removes their data. To remove their login completely or reset a password, use Firebase console → Authentication → Users.</div>':''}`;
}
async function viewUser(id,name){try{await flushSave()}catch(e){}viewing={id,username:name};D=await Store.load(id);tab='today';render();toast('Now viewing '+name)}
async function stopViewing(){try{await flushSave()}catch(e){}viewing=null;D=await Store.load(S.id);tab='admin';render()}
async function adminReset(id,name){const p=prompt(`New password for ${name} (min 4 characters):`);if(!p)return;if(p.length<4){toast('Too short');return}await Store.resetPassword(id,p);toast('Password reset for '+name)}
async function adminDisable(id,v){await Store.setDisabled(id,v);toast(v?'User disabled':'User enabled');render()}
async function adminDelete(id,name){if(!confirm(`Delete user "${name}" and ALL their data? This cannot be undone.`))return;await Store.deleteUser(id);toast('User deleted');render()}

/* =====================================================================
   START
   ===================================================================== */
(async function start(){
  const pill=document.getElementById('modePill');
  const cfg=window.VIANA_FIREBASE_CONFIG;
  if(cfg&&cfg.apiKey&&!/PASTE|YOUR_/i.test(cfg.apiKey)){
    try{
      const v='10.12.2',b=`https://www.gstatic.com/firebasejs/${v}/`;
      await loadScript(b+'firebase-app-compat.js');await loadScript(b+'firebase-auth-compat.js');await loadScript(b+'firebase-firestore-compat.js');
      Store=CloudStore;
      const s=await Store.init();
      pill.textContent='☁ Cloud mode — sign in from any device';
      if(s){S=s;await enterApp();}
      return;
    }catch(e){
      console.error(e);Store=LocalStore;
      pill.innerHTML='<span style="color:var(--bad)">Could not connect to Firebase ('+esc(e.message||e)+'). Using this browser only.</span>';
    }
  }else pill.textContent='Local mode — data is saved in this browser only';
  const s=await LocalStore.init();if(s){S=s;await enterApp()}
})();
</script>
